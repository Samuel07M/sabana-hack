# config/demo.yaml · escenario de la demo (se aplica ENCIMA de default.yaml; solo lo que cambia)
# Secuencia (≈3 min a 1 h simulada por segundo): noche húmeda del día 2 con un foco latente en B1 · Nave 2 · Cama 14
# → alerta riesgo_7d (06:00) → el dron pasa de patrulla a prioridad → inspecciona → confirmada → ventilación apagada (auto)
# → seguimiento a los 3 días (mejora) → paso "Sin red" (run_vivo escribe cola_sync; el hub muestra "Pasa el celular").
semilla: 35                             # fuente: supuesto · elegida para que la secuencia ocurra completa, con IA o solo con reglas (ver tests/test_demo.py)
sim: {dias: 8, inicio: "2026-11-01T00:00:00"}   # fuente: supuesto · 192 h ≈ 3 min a 1 h/s
geometria:
  bloques: 1                            # fuente: supuesto · solo el Bloque 1
clima:
  eventos_humedos_por_dia: 0.0          # fuente: supuesto · sin eventos aleatorios: solo el forzado
  eventos_forzados:                     # fuente: supuesto · jornada húmeda del día 2 solo en la Nave 2 (horas 30-54; termina al calcular el riesgo de las 06:00)
    - {bloque: 1, nave: 2, hora: 30, duracion_h: 24, subida_hr: 25.0}
enfermedad:
  focos_forzados:                       # fuente: supuesto · foco latente (3 plantas) en Nave 2 · Cama 14, justo antes de la alerta de las 06:00
    - {cama_id: B1-N2-C14, posicion: 21, hora: 52}
    - {cama_id: B1-N2-C14, posicion: 22, hora: 52}
    - {cama_id: B1-N2-C14, posicion: 23, hora: 52}
  beta_0: 0.0                           # fuente: supuesto · sin contagios espontáneos en la demo
  beta_aire: 0.0                        # fuente: supuesto · sin contagio por aire en la demo: la historia se queda en la Cama 14
  eficacia_tratamiento: 0.6             # fuente: supuesto · para que la revisita muestre `mejora`
riesgo:
  umbral_alto: 0.45                     # fuente: supuesto · la IA es prudente sin vecinas confirmadas; en la demo la jornada húmeda debe cruzar el umbral
drones:
  sens_latente: 0.5                    # fuente: supuesto · una cámara que se acerca ve un foco latente con buena probabilidad
  tasa_falsa_deteccion_planta: 0.0      # fuente: supuesto · sin falsas alarmas en la demo
