# config/default.yaml · Berry Good Idea
# Cada sección tiene dueño: no edites las secciones del otro sin avisar (NOTAS.md, decisión 3).
# Todo parámetro lleva su origen: biología (Sara B.) | supuesto | ficha técnica.
# "biología (Sara B.)" = documento "Scientificic information.pdf"; entre corchetes la marca del PDF:
#   [A] fuente de arándano · [P] modelo publicado (otro cultivo) · [S] supuesto o inferencia del reporte.

# ── Santiago ────────────────────────────────────────────────────────────────
semilla: 7                              # fuente: supuesto
sim: {dias: 60, inicio: "2026-11-01T00:00:00"}   # fuente: supuesto
base_datos: {busy_timeout_ms: 5000}     # fuente: supuesto · espera si el dashboard está leyendo (WAL)
geometria:
  bloques: 4                            # fuente: supuesto
  naves_por_bloque: 6                   # fuente: supuesto
  camas_por_nave: 12                    # fuente: supuesto
  plantas_por_cama: 40                  # fuente: supuesto
  tiene_ventilacion: true               # fuente: supuesto · todas las naves tienen ventilación controlable (contrato: camas.tiene_ventilacion)
  posiciones_esquina: [5, 5]            # fuente: supuesto · primeras y últimas 5 posiciones (es_borde_planta)
  separacion_camas_m: 1.8               # fuente: biología (Sara B.) [S]
  separacion_plantas_m: 0.5             # fuente: supuesto (el PDF no lo trae)
clima:
  T_media: 15.0                         # fuente: biología (Sara B.) · altiplano 12–18 °C
  A_T: 3.0                              # fuente: biología (Sara B.) · amplitud que da 12–18 °C
  HR_media: 82.0                        # fuente: supuesto · PDF: HR > 70 %; calibrado para que las noches rocen 95 %
  A_HR: 12.0                            # fuente: supuesto · mínimo diurno ~70 %, máximo nocturno ~94 %
  extra_borde_hr: 4.0                   # fuente: supuesto · bordes más húmedos (follaje junto entre camas, PDF)
  delta_ventilacion_hr: -5.0            # fuente: supuesto
  eventos_humedos_por_dia: 0.15         # fuente: supuesto
  duracion_evento_h: [6, 18]            # fuente: supuesto
  subida_evento_hr: 12.0                # fuente: supuesto
  hr_rango: [30.0, 100.0]               # fuente: supuesto
  offset_nave_T_sd: 0.5                 # fuente: supuesto
  offset_nave_HR_sd: 2.0                # fuente: supuesto
  ruido_T_sd: 0.3                       # fuente: supuesto
  ruido_HR_sd: 1.5                      # fuente: supuesto
mojado:                                 # cómo se pasa de HR a horas de mojado (PDF, "Pasar de HR a horas de mojado")
  umbral_hr: 95.0                       # fuente: biología (Sara B.) [P] Broome 1995 · no validado en arándano: declararlo
  pausa_seca_reinicio_h: 4              # fuente: biología (Sara B.) [P] Broome · pausa seca > 4 h reinicia el conteo
  riego_horas: [7]                      # fuente: supuesto · el riego moja aunque la HR no suba (PDF)
  riego_duracion_h: 1                   # fuente: supuesto
  magnus_a: 17.62                       # fuente: biología (Sara B.) · punto de rocío, constantes de Sonntag
  magnus_b: 243.12                      # fuente: biología (Sara B.)
enfermedad:                             # Botrytis cinerea (moho gris)
  # Factor ambiental = Nair y Allen (1993) para baya: I/Imax = 1 − exp(−(Q·W/Ktime)²), Q = exp(−((T−Topt)/Ktemp)²)
  organo: baya                          # fuente: biología (Sara B.) · 'baya' o 'flor'
  nair_allen:                           # fuente: biología (Sara B.) [P] vid; reproduce la tabla de arándano de UMaine [A]
    baya: {Imax: 100.0, Ktime_h: 13.9, T_opt: 20.8, K_temp: 8.9}
    flor: {Imax: 95.6, Ktime_h: 1.3, T_opt: 23.7, K_temp: 10.5}
  T_sin_infeccion: 40.0                 # fuente: biología (Sara B.) [P] · por encima no hay infección
  # Núcleo de dispersión exponencial K(d) = exp(−b·d), d en metros
  b_dispersion_por_m: 0.5               # fuente: biología (Sara B.) [S] · semidistancia 1,4 m
  corte_nucleo: 0.05                    # fuente: supuesto · pesos menores se descartan (matriz dispersa)
  L_aire_camas: 3.0                     # fuente: supuesto · esporas viajan por aire (PDF: gran potencial de salto)
  beta_vec: 0.05                        # fuente: supuesto · calibrar (ver meta_cama_adyacente_7d)
  beta_aire: 0.02                       # fuente: supuesto · calibrar
  beta_0: 2.0e-6                        # fuente: supuesto · conidios casi uniformes en el aire del invernadero (PDF)
  peso_latente: 0.5                     # fuente: supuesto
  peso_sintomas: 1.0                    # fuente: supuesto
  latencia_dias: [7, 14]                # fuente: supuesto · PDF: no verificado en arándano; su ejemplo usa 14
  sintomas_a_perdida_dias: [14, 28]     # fuente: supuesto
  eficacia_tratamiento: 0.85            # fuente: supuesto
  dias_proteccion: 4                    # fuente: supuesto
  focos_por_temporada: [1, 3]           # fuente: supuesto
  # Metas de calibración
  meta_cama_adyacente_7d: 0.055         # fuente: biología (Sara B.) [S] · 1 foco, f_ambiental = 1 → 5,5 % en 1 semana
  meta_afectadas_sensor_central: [0.05, 0.15]   # fuente: supuesto · % de plantas al final de la temporada
  tasa_logistica_r_dia: 0.2             # fuente: biología (Sara B.) [S] · solo para chequear el crecimiento de un foco sin tratar
sensores:
  ruido_T_sd: 0.2                       # fuente: supuesto
  ruido_HR_sd: 1.0                      # fuente: supuesto
drones:
  por_bloque: 1                         # fuente: supuesto
  min_por_cama: 6                       # fuente: supuesto
  sens_latente: 0.25                    # fuente: supuesto
  sens_sintomas: 0.90                   # fuente: supuesto · moho gris-pardo visible en flores y frutos (PDF)
  especificidad: 0.98                   # fuente: supuesto
  dias_revisita: 3                      # fuente: supuesto
  limpias_para_cerrar: 2                # fuente: supuesto
  horas_hasta_tratamiento: 6            # fuente: supuesto
  horas_sin_visita_prioridad: 24        # fuente: supuesto
  horas_ventilacion_apagada: 48         # fuente: supuesto
  bateria_horas: 6                      # fuente: supuesto
  bateria_min: 0.15                     # fuente: supuesto · fracción de carga
  horas_carga: 1                        # fuente: supuesto
riesgo:
  umbral_alto: 0.6                      # fuente: supuesto
  umbral_medio: 0.3                     # fuente: supuesto
  hora_calculo: 6                       # fuente: supuesto
  horizonte_h: 168                      # fuente: supuesto
  # Línea base de reglas = índice de Broome et al. (1995): ln(Y/(1−Y)) = c0 + c1·W + c2·W·T + c3·W·T²
  broome_coef: [-2.647866, -0.374927, 0.061601, -0.001511]   # fuente: biología (Sara B.) [P]
  broome_T_rango: [12.0, 32.0]          # fuente: biología (Sara B.) [P] · T se recorta a este rango
  broome_niveles: [0.0, 0.5, 1.0]       # fuente: biología (Sara B.) [P] · nulo ≤ 0 < bajo ≤ 0,5 < moderado ≤ 1 < alto
  bonus_confirmadas: 0.5                # fuente: supuesto
entrenamiento:
  semillas_train: [0, 39]
  semillas_test: [40, 49]
actual: {p_humano: 0.35, dias_ronda: 4}  # fuente: supuesto
celular:
  ventana_hora: [7, 15]                 # fuente: supuesto · una pasada al día
analisis:
  top_k_camas: 10
  umbral_foco_no_detectado: 5
alertas:                                # severidades acordadas (NOTAS.md, decisión 8)
  severidad:
    riesgo_7d: advertencia
    confirmacion: critica
    descartada: info
    ventilacion: advertencia
    seguimiento: info
    seguimiento_empeora: critica

# ── Samuel ──────────────────────────────────────────────────────────────────
dashboard:
  refresco_s: 2                         # fuente: supuesto
  acciones:                             # NOTAS.md, decisión 6 · ninguna vuelve al simulador
    riesgo_7d: [inspeccion_priorizada, monitorear, ignorar]
    confirmacion: [tratamiento_programado, tratamiento_aplicado]
    seguimiento: [continuar_seguimiento, retratar]
    ventilacion: [entendido]
    descartada: [entendido]
