# config/default.yaml · Berry Good Idea
# Cada sección tiene dueño: no edites las secciones del otro sin avisar (NOTAS.md, decisión 3).
# Todo parámetro lleva su origen: biología (Sara B.) | supuesto | ficha técnica.
# "biología (Sara B.)" = documento "Scientificic information.pdf"; entre corchetes la marca del PDF:
#   [A] fuente de arándano · [P] modelo publicado (otro cultivo) · [S] supuesto o inferencia del reporte.

# ── Santiago ────────────────────────────────────────────────────────────────
semilla: 7                              # fuente: supuesto
sim: {dias: 60, inicio: "2026-11-01T00:00:00"}   # fuente: supuesto
base_datos: {busy_timeout_ms: 5000}     # fuente: supuesto · espera si el dashboard está leyendo (WAL)
geometria:
  bloques: 4                            # fuente: supuesto
  naves_por_bloque: 6                   # fuente: supuesto
  camas_por_nave: 12                    # fuente: supuesto
  plantas_por_cama: 40                  # fuente: supuesto
  tiene_ventilacion: true               # fuente: supuesto · todas las naves tienen ventilación controlable (contrato: camas.tiene_ventilacion)
  posiciones_esquina: [5, 5]            # fuente: supuesto · primeras y últimas 5 posiciones (es_borde_planta)
  separacion_camas_m: 1.8               # fuente: biología (Sara B.) [S]
  separacion_plantas_m: 0.5             # fuente: supuesto (el PDF no lo trae)
clima:
  T_media: 15.0                         # fuente: biología (Sara B.) · altiplano 12–18 °C
  A_T: 3.0                              # fuente: biología (Sara B.) · amplitud que da 12–18 °C
  HR_media: 88.0                        # fuente: supuesto · PDF: HR > 70 %; noches de 95-100 % sin ventilación (con ella ~13 % de las horas mojadas)
  A_HR: 12.0                            # fuente: supuesto · mínimo diurno ~76 %, máximo nocturno ~100 %
  extra_borde_hr: 4.0                   # fuente: supuesto · bordes más húmedos (follaje junto entre camas, PDF)
  delta_ventilacion_hr: -5.0            # fuente: supuesto
  eventos_humedos_por_dia: 0.25         # fuente: supuesto
  duracion_evento_h: [6, 18]            # fuente: supuesto
  subida_evento_hr: 12.0                # fuente: supuesto
  hr_rango: [30.0, 100.0]               # fuente: supuesto
  offset_nave_T_sd: 0.5                 # fuente: supuesto
  offset_nave_HR_sd: 2.0                # fuente: supuesto
  ruido_T_sd: 0.3                       # fuente: supuesto
  ruido_HR_sd: 1.5                      # fuente: supuesto
  eventos_forzados: []                  # fuente: supuesto · demo: [{bloque, nave (opcional), hora, duracion_h, subida_hr (opcional)}]
mojado:                                 # cómo se pasa de HR a horas de mojado (PDF, "Pasar de HR a horas de mojado")
  umbral_hr: 95.0                       # fuente: biología (Sara B.) [P] Broome 1995 · no validado en arándano: declararlo
  pausa_seca_reinicio_h: 4              # fuente: biología (Sara B.) [P] Broome · pausa seca > 4 h reinicia el conteo
  riego_horas: [7]                      # fuente: supuesto · el riego moja aunque la HR no suba (PDF)
  riego_duracion_h: 1                   # fuente: supuesto
  magnus_a: 17.62                       # fuente: biología (Sara B.) · punto de rocío, constantes de Sonntag
  magnus_b: 243.12                      # fuente: biología (Sara B.)
enfermedad:                             # Botrytis cinerea (moho gris)
  # Factor ambiental = Nair y Allen (1993) para baya: I/Imax = 1 − exp(−(Q·W/Ktime)²), Q = exp(−((T−Topt)/Ktemp)²)
  organo: baya                          # fuente: biología (Sara B.) · 'baya' o 'flor'
  nair_allen:                           # fuente: biología (Sara B.) [P] vid; reproduce la tabla de arándano de UMaine [A]
    baya: {Imax: 100.0, Ktime_h: 13.9, T_opt: 20.8, K_temp: 8.9}
    flor: {Imax: 95.6, Ktime_h: 1.3, T_opt: 23.7, K_temp: 10.5}
  T_sin_infeccion: 40.0                 # fuente: biología (Sara B.) [P] · por encima no hay infección
  # Núcleo de dispersión exponencial K(d) = exp(−b·d), d en metros
  b_dispersion_por_m: 0.5               # fuente: biología (Sara B.) [S] · semidistancia 1,4 m
  corte_nucleo: 0.05                    # fuente: supuesto · pesos menores se descartan (matriz dispersa)
  L_aire_camas: 3.0                     # fuente: supuesto · esporas viajan por aire (PDF: gran potencial de salto)
  beta_cama: 0.002529                   # fuente: calibrado (python -m sim.calibracion) · dentro de la cama: logística r = 0,2/día (PDF [S]) en campo medio, f_ambiental = 1
  beta_vec: 7.08e-5                     # fuente: calibrado (python -m sim.calibracion) · entre camas: la cama contigua se infecta con 5,5 % en 7 días (PDF [S], 1 foco, f_ambiental = 1)
  beta_aire: 0.1                        # fuente: supuesto calibrado · el PDF no cuantifica el transporte por aire; con beta_0 da ≈ 9,7 % afectadas en sensor_central (meta 5-15 %). Es el que más propaga: sin él, 0,09 %
  beta_0: 1.0e-4                        # fuente: supuesto calibrado · conidios casi uniformes en el aire del invernadero (PDF, cualitativo); siembra focos nuevos
  peso_latente: 0.5                     # fuente: supuesto
  peso_sintomas: 1.0                    # fuente: supuesto
  latencia_dias: [7, 14]                # fuente: supuesto · PDF: no verificado en arándano; su ejemplo usa 14
  sintomas_a_perdida_dias: [14, 28]     # fuente: supuesto
  eficacia_tratamiento: 0.85            # fuente: supuesto
  dias_proteccion: 4                    # fuente: supuesto
  focos_por_temporada: [1, 3]           # fuente: supuesto
  foco_ventana_dias: [0, 30]            # fuente: supuesto · los focos aparecen en este rango de días
  foco_preferencia_borde: 3.0           # fuente: supuesto · peso extra de las plantas de borde para sembrar focos
  focos_forzados: []                    # fuente: supuesto · demo: [{cama_id, posicion, hora}] (si hay, reemplazan a los aleatorios)
  # Metas de calibración
  meta_cama_adyacente_7d: 0.055         # fuente: biología (Sara B.) [S] · P(la cama contigua se infecta) con 1 foco y f_ambiental = 1 en 1 semana
  meta_afectadas_sensor_central: [0.05, 0.15]   # fuente: supuesto · % de plantas al final de la temporada
  tasa_logistica_r_dia: 0.2             # fuente: biología (Sara B.) [S] · meta de beta_cama: crecimiento de un foco dentro de su cama
sensores:
  ruido_T_sd: 0.2                       # fuente: supuesto
  ruido_HR_sd: 1.0                      # fuente: supuesto
robots:
  por_bloque: 1                         # fuente: supuesto
  min_por_cama: 6                       # fuente: supuesto
  sens_latente: 0.25                    # fuente: supuesto
  sens_sintomas: 0.90                   # fuente: supuesto · moho gris-pardo visible en flores y frutos (PDF)
  especificidad: 0.98                   # fuente: supuesto · de la verificación de una sospecha (P[descartar un falso positivo])
  tasa_falsa_deteccion_planta: 4.0e-6   # fuente: supuesto · P[que la cámara marque una planta sana] por inspección
  horas_verificacion: 1                 # fuente: supuesto · tiempo entre la sospecha y su verificación
  dias_revisita: 3                      # fuente: supuesto
  limpias_para_cerrar: 2                # fuente: supuesto
  horas_hasta_tratamiento: 6            # fuente: supuesto
  horas_sin_visita_prioridad: 6         # fuente: supuesto · con 24 h la prioridad nunca se activa (la patrulla pasa cada 7,2 h): ver NOTAS.md
  horas_ventilacion_apagada: 48         # fuente: supuesto
  bateria_horas: 6                      # fuente: supuesto
  bateria_min: 0.15                     # fuente: supuesto · fracción de carga
  horas_carga: 1                        # fuente: supuesto
riesgo:
  umbral_alto: 0.6                      # fuente: supuesto
  umbral_medio: 0.3                     # fuente: supuesto
  hora_calculo: 6                       # fuente: supuesto
  horizonte_h: 168                      # fuente: supuesto
  # Línea base de reglas = índice de Broome et al. (1995): ln(Y/(1−Y)) = c0 + c1·W + c2·W·T + c3·W·T²
  broome_coef: [-2.647866, -0.374927, 0.061601, -0.001511]   # fuente: biología (Sara B.) [P]
  broome_T_rango: [12.0, 32.0]          # fuente: biología (Sara B.) [P] · T se recorta a este rango
  broome_niveles: [0.0, 0.5, 1.0]       # fuente: biología (Sara B.) [P] · nulo ≤ 0 < bajo ≤ 0,5 < moderado ≤ 1 < alto
  bonus_confirmadas: 0.5                # fuente: supuesto
  hr_alta: 85.0                         # fuente: supuesto · HR media diaria que cuenta como "día de HR alta"
  edad_max_h: 168                       # fuente: supuesto · tope de edad_lectura_h
  vecinas_camas: 2                      # fuente: supuesto · camas a cada lado que cuentan como vecinas
  sin_confirmada_camas: 99              # fuente: supuesto · distancia cuando no hay confirmadas en la nave
entrenamiento:
  semillas_train: [0, 39]
  semillas_test: [40, 49]
  max_iter: 60                          # fuente: supuesto · elegido en validación con las semillas 30-39 (solo del bloque de entrenamiento)
  learning_rate: 0.05                   # fuente: supuesto
  max_depth: 3                          # fuente: supuesto
  min_samples_leaf: 500                 # fuente: supuesto · alto: las filas de una misma cama y semana están muy correlacionadas
  l2_regularization: 1.0                # fuente: supuesto
  repeticiones_permutacion: 3           # fuente: supuesto
  muestra_permutacion: 60000            # fuente: supuesto · filas de prueba usadas para la importancia por permutación
actual: {p_humano: 0.35, dias_ronda: 4, hora_ronda: 10}  # fuente: supuesto · una cama por pasada cada dias_ronda
celular:
  ventana_hora: [7, 15]                 # fuente: supuesto · una pasada al día
analisis:
  top_k_camas: 10
  umbral_foco_no_detectado: 5
  semilla_inicial_validacion: 40        # fuente: supuesto · las semillas de validación empiezan fuera del entrenamiento
  bootstrap_n: 2000                     # fuente: supuesto
  ic_nivel: 0.95                        # fuente: supuesto
  ventana_alto_antes_dias: 7            # fuente: supuesto · una alerta `alto` cuenta como aviso desde 7 días antes de la infección
alertas:                                # severidades acordadas (NOTAS.md, decisión 8)
  severidad:
    riesgo_7d: advertencia
    confirmacion: critica
    descartada: info
    ventilacion: advertencia
    seguimiento: info
    seguimiento_empeora: critica

# ── Samuel ──────────────────────────────────────────────────────────────────
dashboard:
  refresco_s: 2                         # fuente: supuesto
  acciones:                             # NOTAS.md, decisión 6 · ninguna vuelve al simulador
    riesgo_7d: [inspeccion_priorizada, monitorear, ignorar]
    confirmacion: [tratamiento_programado, tratamiento_aplicado]
    seguimiento: [continuar_seguimiento, retratar]
    ventilacion: [entendido]
    descartada: [entendido]
  corrida_por_defecto: demo             # fuente: supuesto · se cambia con ?corrida= en la URL
  mock:                                 # hub/mock.py · parámetros del prototipo que no existen arriba
    hora_inicial: 8                     # fuente: supuesto · --vivo empieza aquí
    horas_por_segundo: 1                # fuente: supuesto · ritmo de --vivo
    corridas:                           # fuente: supuesto · las tres corridas del prototipo
      - {corrida_id: demo, modo: vivo, escenario: demo, semilla: 7, guion: true}
      - {corrida_id: temporada-7, modo: temporada, escenario: robots, semilla: 7, guion: false}
      - {corrida_id: celular-12, modo: temporada, escenario: robots_celular, semilla: 12, guion: false}
    sensor_fijo: {nave: 3, cama_en_nave: 6}   # fuente: supuesto · un sensor fijo por bloque
    enfermedad:                         # contagio simplificado del prototipo (los beta de arriba son de otro núcleo)
      T_opt: 18.0                       # fuente: supuesto
      T_ancho: 6.0                      # fuente: supuesto
      horas_mojado_full: 10             # fuente: supuesto · horas de mojado en 24 h para factor 1
      beta_vec: 0.008                   # fuente: supuesto · plantas vecinas en la cama (±2 posiciones); el prototipo usaba 0,05 con un clima más seco
      peso_cama_vecina: 0.4             # fuente: supuesto · plantas de las camas contiguas (±1 posición)
      beta_aire: 0.0005                 # fuente: supuesto · corriente de aire hacia las camas siguientes
      beta_0: 5.0e-7                    # fuente: supuesto · fondo
      peso_foco_borde: 0.6              # fuente: supuesto · P[foco aleatorio en cama de borde]
      dias_ventana_foco: 10             # fuente: supuesto · focos aleatorios en los primeros días
    robots:
      factor_inspeccion_prioridad: 2    # fuente: supuesto · la visita prioritaria mira más de cerca
      factor_fp_patrulla: 0.02          # fuente: supuesto · falsas sospechas en patrulla
      prob_confirmar: 0.9               # fuente: supuesto
      confianza_confirmada: [0.75, 0.95]   # fuente: supuesto
      confianza_descartada: [0.40, 0.60]   # fuente: supuesto
      horas_validez_lectura: 8          # fuente: supuesto · una lectura del robot vale para la cama 8 h
    modelo_prueba:                      # fuente: supuesto · modelo de prueba del prototipo (riesgo_reglas y prob_ia_7d)
      ventana_h: 72
      umbral_mojado_reglas_h: 20
      bonus_vecina: 0.5
      a0: -6.0                          # prototipo: -5,2; recalibrado al clima de arriba (HR 88 %, umbral 95 %)
      a_mojado: 0.16
      a_temp: 1.5
      a_borde: 0.8
      a_vecina: 2.5
      a_delta: 0.04
      ruido: 0.35
    guion_demo:                         # fuente: supuesto · secuencia de la demo en B1 · Nave 2 · Cama 14
      cama: B1-N2-C14
      hora_foco: 24
      posiciones_foco: [21, 22, 23]
      evento: {bloque: 1, ini: 68, fin: 82, subida_hr: 14.0}
      dias_sin_eventos: 7               # sin eventos aleatorios en el Bloque 1 durante la primera semana
      dia_alerta: 3
      prob_min: 0.74
      posicion: 22
      plantas: 3
      confianza: 0.88
      seguimientos: [[mejora, 1], [limpia, 0], [limpia, 0]]
  mapa:                                 # fuente: supuesto · mapa 3D (unidades del SVG)
    cama_ancho: 26
    cama_largo: 78
    sep_camas: 8
    pasillo: 32
    altura_max: 48
    altura_robot: 112
    vista_inicial: {theta: -28, elev: 50, zoom: 1}
  ui:                                   # fuente: supuesto
    max_alertas_lista: 120
    horas_grafica: 72
    dias_riesgo: 14
    max_historial_ventilacion: 20
    top_camas: 6
  tour:                                 # dashboard/tour · tour guiado del pitch (pasos en dashboard/tour/pasos.py)
    corrida: demo                       # fuente: supuesto · corrida que reproduce (python -m sim.run_vivo --velocidad 0)
    ms_por_hora: 100                    # fuente: supuesto · avance acelerado entre hitos: 1 h simulada cada 100 ms
    horas_por_segundo_play: 1           # fuente: supuesto · play normal al salir del tour (= run_vivo --velocidad 1)
    espera_target_ms: 2000              # fuente: supuesto · espera del elemento destacado antes de centrar el recuadro
    espera_vivo_s: 3                    # fuente: supuesto · sin hito y sin datos nuevos en este tiempo, el paso se muestra igual
