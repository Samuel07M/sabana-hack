<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Berry Good Idea · Monitoreo</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='18' r='9' fill='%235B6CF0'/%3E%3Ccircle cx='21' cy='13' r='8' fill='%238B5CF6'/%3E%3C/svg%3E">
<!--
  Berry Good Idea · Dashboard (Sabana Hack 2026)
  - Un solo archivo, sin internet, sin librerías externas.
  - Capas:
      1. CONFIG          → config/default.yaml + config/dashboard.yaml
      2. util            → ubicación / tiempo / rng
      3. DB              → mismas tablas y columnas de contrato/schema.sql
      4. FUENTE DE DATOS → reemplazable: hoy genera las filas localmente; en producción lo reemplaza hub/api (data/finca.db)
      5. Hub             → consultas y escrituras permitidas. La UI SOLO habla con el Hub.
      6. UI              → componentes de solo lectura sobre el Hub.
  - Selección de corrida sin UI: ?corrida=demo | temporada-7 | celular-12
-->
<style>
:root{
  color-scheme:dark;
  --bg:#0A0F1E;
  --bg-grad:radial-gradient(1100px 620px at 85% -15%,rgba(124,140,255,.12),transparent 60%),radial-gradient(900px 520px at -10% 115%,rgba(183,148,246,.08),transparent 60%);
  --side:#0C1224; --card:#10172E; --card-2:#141C36; --card-3:#1A2342; --hover:rgba(148,163,210,.06);
  --border:rgba(148,163,210,.10); --border-2:rgba(148,163,210,.18);
  --text:#E8ECF6; --muted:#97A2BC; --faint:#5F6A86;
  --accent:#8C9EFF; --accent-2:#B79CFF; --accent-soft:rgba(140,158,255,.13);
  --bajo:#5FBF95; --medio:#E5B85C; --alto:#F07178; --sindato:#3E4866;
  --info:#74A9FF; --adv:#E5B85C; --crit:#F07178; --ok:#5FBF95; --insp:#B79CFF;
  --floor:#0E1530; --plate:#151E3C; --plate-off:rgba(229,184,92,.10); --flow:#74A9FF; --lbl:#7C88A6;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 14px 34px -18px rgba(0,0,0,.6);
  --r:18px; --r-sm:12px;
  --font:"Inter","SF Pro Text",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F5FA;
  --bg-grad:radial-gradient(1100px 620px at 85% -15%,rgba(91,108,240,.09),transparent 60%),radial-gradient(900px 520px at -10% 115%,rgba(139,92,246,.06),transparent 60%);
  --side:#FFFFFF; --card:#FFFFFF; --card-2:#F6F8FC; --card-3:#EDF0F7; --hover:rgba(30,41,80,.035);
  --border:rgba(30,41,80,.08); --border-2:rgba(30,41,80,.14);
  --text:#141A2E; --muted:#5C6680; --faint:#9AA3B8;
  --accent:#5B6CF0; --accent-2:#8B5CF6; --accent-soft:rgba(91,108,240,.10);
  --bajo:#2E9E6E; --medio:#C98A1B; --alto:#E0525C; --sindato:#C3CADB;
  --info:#3B7DF0; --adv:#C98A1B; --crit:#E0525C; --ok:#2E9E6E; --insp:#8B5CF6;
  --floor:#E6EBF5; --plate:#D8DFEE; --plate-off:rgba(201,138,27,.16); --flow:#3B7DF0; --lbl:#7A849C;
  --shadow:0 1px 2px rgba(20,26,46,.04),0 14px 34px -20px rgba(20,26,46,.22);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);background-image:var(--bg-grad);background-attachment:fixed;color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
select{font:inherit;color:inherit}
.ic{flex:none;display:block}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px}
.spacer{flex:1}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px 18px;border-right:1px solid var(--border);
  background:color-mix(in srgb,var(--side) 82%,transparent);backdrop-filter:blur(16px);display:flex;flex-direction:column;gap:26px;z-index:30}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand .name{font-weight:700;font-size:15.5px;letter-spacing:-.01em}
.brand .sub{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 12px 6px;font-weight:600}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--muted);font-weight:550;width:100%;text-align:left;transition:background .15s,color .15s}
.nav button:hover{background:var(--hover);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--text)}
.nav button.on .ic{color:var(--accent)}
.nav .cnt{margin-left:auto;min-width:22px;height:20px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:650;display:inline-grid;place-items:center;background:var(--card-3);color:var(--muted)}
.nav .cnt.hot{background:color-mix(in srgb,var(--crit) 20%,transparent);color:var(--crit)}
.side-foot{margin-top:auto;padding:14px;border-radius:16px;background:var(--card-2);border:1px solid var(--border)}
.main{min-width:0;padding:0 32px 48px}
.top{display:flex;align-items:center;gap:18px;padding:26px 0 22px;flex-wrap:wrap}
.top h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.02em}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.clock{display:flex;align-items:center;gap:12px;padding:8px 14px;border-radius:14px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow)}
.clock .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.clock .d{font-size:12px;color:var(--muted);line-height:1.3}
.ibtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid var(--border);color:var(--muted);position:relative;transition:.15s;box-shadow:var(--shadow)}
.ibtn:hover{color:var(--text);border-color:var(--border-2)}
.ibtn .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 2px var(--card)}

/* ---------- elementos ---------- */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card-hd{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.card h3{margin:0;font-size:15px;font-weight:650;letter-spacing:-.01em}
.card .sub{color:var(--muted);font-size:12.5px}
.sec{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:650;margin:18px 0 10px}
.ico-box{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;color:var(--c,var(--accent));background:color-mix(in srgb,var(--c,var(--accent)) 14%,transparent)}
.ico-box.sm{width:32px;height:32px;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;
  background:color-mix(in srgb,var(--c,var(--muted)) 13%,transparent);color:color-mix(in srgb,var(--c,var(--muted)) 88%,var(--text))}
.chip .d{width:6px;height:6px;border-radius:50%;background:var(--c,var(--muted))}
.chip.pulse .d{animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.c-bajo{--c:var(--bajo)} .c-medio{--c:var(--medio)} .c-alto{--c:var(--alto)} .c-sindato{--c:var(--faint)}
.c-info{--c:var(--info)} .c-advertencia{--c:var(--adv)} .c-critica{--c:var(--crit)}
.c-ok{--c:var(--ok)} .c-primary{--c:var(--accent)} .c-insp{--c:var(--insp)} .c-mute{--c:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:11px;background:var(--card-2);border:1px solid var(--border);font-weight:600;font-size:13px;transition:.15s}
.btn:hover{border-color:var(--border-2);background:var(--card-3)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff}
:root:not([data-theme="light"]) .btn.primary{color:#0B1020}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--text);background:var(--hover)}
.seg{display:inline-flex;background:var(--card-2);border:1px solid var(--border);border-radius:12px;padding:3px;gap:2px}
.seg button{border-radius:9px;padding:6px 12px;color:var(--muted);font-weight:600;font-size:12.5px;display:inline-flex;gap:6px;align-items:center;transition:.15s}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.18),0 0 0 1px var(--border-2)}
.tbtn{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--border);color:var(--muted)}
.tbtn:hover{color:var(--text);border-color:var(--border-2)}
.bar{height:6px;background:var(--card-3);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,var(--accent));border-radius:999px;transition:width .4s}
.sel-in{background:var(--card-2);border:1px solid var(--border);border-radius:11px;padding:7px 10px;font-size:13px;font-weight:550}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ico-box{margin:0 auto 12px;width:48px;height:48px;border-radius:14px}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:18px}
.kpi{display:flex;flex-direction:column;gap:12px;padding:18px 20px}
.kpi .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px;font-weight:550}
.kpi .d{font-size:12px;color:var(--faint)}
.kpi .d b{color:var(--text);font-weight:600}
.kpi .spark{height:30px;width:96px}

/* ---------- panorama ---------- */
.finca{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}
.bloques{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.bcard{text-align:left;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow);transition:.18s;display:flex;flex-direction:column;gap:10px}
.bcard:hover{border-color:var(--border-2);transform:translateY(-1px)}
.bcard.on{border-color:color-mix(in srgb,var(--accent) 60%,transparent);box-shadow:0 0 0 3px var(--accent-soft),var(--shadow)}
.bcard b{font-size:13.5px}
.bcard .alarm{width:8px;height:8px;border-radius:50%;background:var(--crit);box-shadow:0 0 0 3px color-mix(in srgb,var(--crit) 22%,transparent)}
.mini{display:grid;grid-template-columns:repeat(12,1fr);gap:2px}
.mini i{height:7px;border-radius:2px;display:block}
.bmeta{display:flex;justify-content:space-between;gap:8px;white-space:nowrap;font-size:11.5px;color:var(--muted)}
.mapa-card{padding:20px 20px 16px}
/* Panorama sin recuadros: todo sobre el fondo base, alrededor del mapa */
.pano .card,.pano .bcard{background:transparent;border:0;box-shadow:none;border-radius:0;backdrop-filter:none}
.pano .card{padding:0}
.pano .kpis{gap:32px;margin-bottom:26px}
.pano .kpi{padding:0}
.pano .finca{gap:40px;align-items:start}
.pano .mapa-col{gap:0}
.pano .mapa-hd{margin-bottom:10px}
.pano .mapa-host{background:transparent;border:0;border-radius:0}
.pano .mapa-pie{margin-top:8px}
.pano .bloques{margin-top:28px;gap:28px}
.pano .bcard{padding:12px 0 0;border-top:2px solid var(--border)}
.pano .bcard:hover{transform:none;border-top-color:var(--border-2)}
.pano .bcard.on{border-top-color:var(--accent);box-shadow:none}
.pano #fincaSide{gap:36px;padding-top:4px}
.pano .dron-pos{background:transparent;border:0;padding:0;margin-bottom:16px}
.pano .stat{background:transparent;border:0;padding:0}
.pano .rank-i{padding:9px 0}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mapa-host{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,color-mix(in srgb,var(--accent) 6%,var(--card-2)),var(--card-2));border:1px solid var(--border)}
#m3d{display:block;width:100%;height:560px;touch-action:none;cursor:grab;user-select:none}
#m3d.arrastrando{cursor:grabbing}
.mapa-hint{position:absolute;left:14px;bottom:12px;display:flex;gap:8px;align-items:center;font-size:11.5px;color:var(--faint);pointer-events:none}
.mapa-pie{display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-top:14px}
.ramp{display:flex;flex-direction:column;gap:5px;min-width:220px}
.ramp .g{height:8px;border-radius:999px}
.ramp .t{display:flex;justify-content:space-between;font-size:11px;color:var(--faint)}
.lg{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted)}
.m-base{fill:var(--floor)}
.m-nave{fill:var(--plate);stroke:var(--border);stroke-width:1}
.m-nave.off{fill:var(--plate-off);stroke:color-mix(in srgb,var(--adv) 40%,transparent)}
.m-lbl{fill:var(--lbl);font-size:11px;font-weight:650;letter-spacing:.04em}
.m-lbl.cama{font-size:9px;fill:rgba(255,255,255,.85);font-weight:700;pointer-events:none}
.m-flujo{fill:none;stroke:var(--flow);stroke-width:1.6;stroke-dasharray:3 7;stroke-linecap:round;opacity:.75;animation:flujo 1.1s linear infinite}
.m-flujo.off{stroke:var(--faint);opacity:.35;animation:none;stroke-dasharray:2 6}
@keyframes flujo{to{stroke-dashoffset:-20}}
.m-cama{cursor:pointer}
.m-cama polygon{stroke:rgba(0,0,0,.14);stroke-width:.6;stroke-linejoin:round;transition:filter .15s}
.m-cama .m-top{stroke:rgba(255,255,255,.22);stroke-width:.8}
.m-cama:hover polygon{filter:brightness(1.16)}
.m-cama.sel .m-top{stroke:var(--text);stroke-width:2}
.m-planta{stroke:rgba(255,255,255,.28);stroke-width:1.2;stroke-linecap:round;pointer-events:none}
.m-inc{pointer-events:none}
.m-inc .r{fill:none;stroke:var(--crit);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:onda 1.8s ease-out infinite}
.m-inc .c{fill:var(--crit);stroke:#fff;stroke-width:1.5}
@keyframes onda{0%{transform:scale(.6);opacity:1}100%{transform:scale(2.4);opacity:0}}
.m-dron{pointer-events:none;transition:transform .7s cubic-bezier(.4,.1,.2,1)}
.m-dron .m-cable{fill:var(--dc);opacity:.7;transition:transform .7s cubic-bezier(.4,.1,.2,1)}
.m-dron .m-sombra{fill:#000;opacity:.25;transition:transform .7s cubic-bezier(.4,.1,.2,1)}
.m-dron .halo{fill:var(--dc);opacity:.18;transform-box:fill-box;transform-origin:center;animation:halo 2.2s ease-in-out infinite}
@keyframes halo{50%{transform:scale(1.35);opacity:.08}}
.m-dron .brazo{stroke:var(--dc);stroke-width:2;stroke-linecap:round}
.m-dron .rotor{fill:color-mix(in srgb,var(--dc) 30%,transparent);stroke:var(--dc);stroke-width:1.4}
.m-dron .nucleo{fill:var(--dc);stroke:#fff;stroke-width:1.5}
.m-dron .tag{fill:var(--text);font-size:10.5px;font-weight:700}
.sin-anim .m-dron,.sin-anim .m-dron *{transition:none!important}

.dron-pos{padding:14px;border-radius:14px;background:var(--card-2);border:1px solid var(--border);margin-bottom:12px}
.dron-pos .v{font-size:21px;font-weight:700;letter-spacing:-.01em}
.stats2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{padding:12px;border-radius:14px;background:var(--card-2);border:1px solid var(--border)}
.stat .l{font-size:11.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stat .v{font-size:18px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.rank{display:flex;flex-direction:column;gap:4px}
.rank-i{display:grid;grid-template-columns:minmax(0,1fr) 70px 44px;gap:12px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer;transition:background .15s}
.rank-i:hover{background:var(--hover)}
.rank-i .p{text-align:right;font-weight:650;font-size:12.5px;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column}
.feed-i{display:flex;gap:12px;padding:10px 6px;border-radius:12px;cursor:pointer;transition:background .15s}
.feed-i:hover{background:var(--hover)}
.feed-i .t{font-weight:600;font-size:13px;line-height:1.35}
.feed-i .m{font-size:12px;color:var(--muted)}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,8,18,.38);backdrop-filter:blur(2px);z-index:45;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(560px,calc(100vw - 24px));background:var(--card);border:1px solid var(--border-2);border-radius:22px;
  box-shadow:0 30px 80px -20px rgba(0,0,0,.55);z-index:50;transform:translateX(calc(100% + 30px));transition:transform .28s cubic-bezier(.3,.7,.2,1);overflow-y:auto}
.drawer.open{transform:none}
.drawer .in{padding:24px}
.drawer h2{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.gauge-card{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;margin-top:18px}
.gauge{padding:16px;border-radius:16px;background:var(--card-2);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center}
.gauge .v{font-size:28px;font-weight:750;margin-top:-48px;margin-bottom:14px;letter-spacing:-.02em}
.gauge .l{font-size:12px;color:var(--muted);text-align:center}
.factores{display:flex;flex-direction:column;gap:8px}
.factor{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:13px;background:var(--card-2);border:1px solid var(--border);font-size:13px}
.factor b{font-weight:650}
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--font)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.leyenda i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}

/* ---------- timeline ---------- */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--border-2);border-radius:2px}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev::before{content:"";position:absolute;left:-21px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));box-shadow:0 0 0 4px var(--card)}
.tl .ev .h{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.tl .ev .t{font-weight:600;font-size:13px}

/* ---------- alertas ---------- */
.filtros{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 16px}
.filtros .lbl{font-size:11.5px;color:var(--faint);font-weight:650;text-transform:uppercase;letter-spacing:.06em;margin-right:4px}
.alist{display:flex;flex-direction:column;gap:10px}
.acard{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
.acard.nueva{border-color:color-mix(in srgb,var(--c) 35%,var(--border))}
.acard .ah{display:flex;gap:14px;align-items:center;padding:14px 16px;cursor:pointer}
.acard .ah:hover{background:var(--hover)}
.acard .tt{font-weight:650;font-size:13.5px}
.acard .meta{font-size:12px;color:var(--muted);margin-top:2px}
.acard .ab{padding:0 16px 16px 68px}
.acard .msg{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.55}
.acols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;align-items:start}
.acol{display:flex;flex-direction:column;gap:12px;min-width:0}
.acol-hd{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:16px;background:color-mix(in srgb,var(--c) 7%,var(--card));border:1px solid color-mix(in srgb,var(--c) 22%,var(--border))}
.acol-hd h3{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.acol-hd .sub{color:var(--muted);font-size:12.5px}
.acol-n{text-align:right}
.acol-n .v{font-size:26px;font-weight:750;line-height:1;letter-spacing:-.02em}
.newdot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.chev{color:var(--faint);transition:transform .2s}
.chev.open{transform:rotate(180deg)}

/* ---------- incidencias ---------- */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;position:relative}
.pipe-i{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative;padding:4px 6px;text-align:center}
.pipe-i::before{content:"";position:absolute;top:21px;left:-50%;right:50%;height:2px;background:var(--border-2);z-index:0}
.pipe-i:first-child::before{display:none}
.pipe-i .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:750;font-size:16px;position:relative;z-index:1;
  background:color-mix(in srgb,var(--c) 14%,var(--card));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 30%,transparent)}
.pipe-i .l{font-size:12px;color:var(--muted);font-weight:550}
.incs{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:left;font-weight:650;padding:10px 10px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--card)}
td{padding:11px 10px;border-bottom:1px solid var(--border);font-variant-numeric:tabular-nums;font-size:13px}
tbody tr{cursor:pointer;transition:background .12s} tbody tr:hover{background:var(--hover)} tbody tr.sel{background:var(--accent-soft)}
.tblwrap{max-height:540px;overflow:auto;margin:0 -8px}

/* ---------- ventilación / conectividad ---------- */
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vcard{padding:14px;border-radius:15px;background:var(--card-2);border:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
.switch{width:44px;height:26px;border-radius:999px;background:var(--card-3);border:1px solid var(--border-2);position:relative;transition:.2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:.2s}
.switch.on{background:var(--ok);border-color:transparent}
.switch.on::after{left:21px}
.levels{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.level{padding:18px;border-radius:16px;border:1px solid var(--border);background:var(--card-2);opacity:.6;transition:.2s}
.level.on{opacity:1;border-color:color-mix(in srgb,var(--accent) 55%,transparent);box-shadow:0 0 0 3px var(--accent-soft)}
.level .n{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.level .t{font-weight:700;font-size:15px;margin:10px 0 4px}
.hero{display:flex;gap:18px;align-items:center}
.hero .ico-box{width:56px;height:56px;border-radius:18px}
.hero .t{font-size:18px;font-weight:700;letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile .v{font-size:28px;font-weight:750;letter-spacing:-.02em;margin:12px 0 2px;font-variant-numeric:tabular-nums}
.tile .l{font-weight:600;font-size:13px}
.tile .d{font-size:12px;color:var(--muted);margin-top:4px}
.hbar{display:grid;grid-template-columns:120px minmax(0,1fr) 36px;gap:12px;align-items:center;font-size:12.5px;padding:5px 0}
.hbar .bar{height:8px}

/* ---------- toasts / tooltip ---------- */
#toasts{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:10px;max-width:390px}
.toast{display:flex;gap:12px;background:var(--card);border:1px solid var(--border-2);border-radius:16px;padding:14px 16px;box-shadow:0 20px 50px -18px rgba(0,0,0,.55);animation:tin .3s cubic-bezier(.3,.7,.2,1)}
.toast .tt{font-weight:650;font-size:13.5px;margin-bottom:2px}
@keyframes tin{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--card);border:1px solid var(--border-2);border-radius:14px;padding:12px 14px;font-size:12.5px;box-shadow:0 18px 40px -14px rgba(0,0,0,.5);display:none;min-width:220px}
#tip b{font-size:13.5px}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 16px;margin-top:8px}
.kv span:nth-child(odd){color:var(--muted)}
.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}

@media (max-width:1280px){.finca{grid-template-columns:minmax(0,1fr)}.finca>.stack:last-child{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}}
@media (max-width:1100px){.acols{grid-template-columns:minmax(0,1fr)}.kpis,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.incs,.grid2{grid-template-columns:minmax(0,1fr)}.bloques{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:auto 0 0 0;height:auto;flex-direction:row;padding:6px 8px;border-right:0;border-top:1px solid var(--border)}
  .side .brand,.side-foot,.nav-t{display:none}
  .nav{flex-direction:row;justify-content:space-around;width:100%}
  .nav button{flex-direction:column;gap:3px;padding:7px 4px;font-size:10.5px;align-items:center;width:auto;flex:1}
  .nav .cnt{display:none}
  .main{padding:0 16px 96px}
  #m3d{height:420px}
  .pipe{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}
  .levels{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:560px){.kpis,.grid4{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.kpi{padding:14px}.kpi .v{font-size:24px}.kpi .spark{display:none}.clock .d{display:none}.top h1{font-size:19px}.gauge-card{grid-template-columns:1fr}#toasts{left:12px;right:12px;bottom:84px;max-width:none}}
</style>
</head>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function crearRng(semilla){
  const r = mulberry32(semilla);
  return {
    random:r,
    uniform:(a,b)=>a+(b-a)*r(),
    int:(a,b)=>a+Math.floor(r()*(b-a+1)),
    normal:(m=0,s=1)=>{let u=0;while(u===0)u=r();return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*r());},
    choice:arr=>arr[Math.floor(r()*arr.length)],
  };
}

const ic=(n,s=18,w=1.8)=>`<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${I[n]||''}</svg>`;

/* Rampas de color del mapa (rgb) */
const RAMPA_RIESGO=[[0,[78,128,128]],[0.3,[118,182,142]],[0.45,[228,190,96]],[0.6,[240,136,88]],[1,[232,74,94]]];
const RAMPA_HR=[[0,[206,190,148]],[0.45,[120,176,206]],[1,[82,98,226]]];
function rampa(stops,v){
  v=clamp(v,0,1);
  for(let i=1;i<stops.length;i++){const [a,ca]=stops[i-1],[b,cb]=stops[i];if(v<=b){const k=(v-a)/(b-a||1);return ca.map((x,j)=>x+(cb[j]-x)*k);}}
  return stops.at(-1)[1];
}
const rgb=(c,f=1)=>`rgb(${c.map(x=>Math.round(clamp(x*f,0,255))).join(',')})`;
const gradCSS=stops=>`linear-gradient(90deg,${stops.map(([v,c])=>`${rgb(c)} ${Math.round(v*100)}%`).join(',')})`;
function hexRgb(h){h=h.trim().replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');const n=parseInt(h,16);return [(n>>16)&255,(n>>8)&255,n&255];}

/* =====================================================================
   3. BASE DE DATOS · mismas tablas/columnas de contrato/schema.sql
   ===================================================================== */
function crearDB(){
  return {
    corridas:[], camas:[], lecturas:[], riesgo:[], incidencias:[], seguimientos:[],
    alertas:[], drones:[], ventilacion:[], cola_sync:[],
    seq:{incidencia:0, seguimiento:0, alerta:0, cola:0},
    idx:{lectCama:new Map(), sensor:new Map()},
  };
}

/* =====================================================================
   4. FUENTE DE DATOS (reemplazable por hub/api sobre data/finca.db)
   ===================================================================== */
class FuenteLocal {
  constructor(corrida){
    this.c = corrida; this.id = corrida.corrida_id;
    this.rng = crearRng(corrida.semilla);
    this.db = crearDB();
    this.hora = 0;
    this.red = corrida.escenario==='drones_celular' ? 'sin_red' : 'local';
    this.autoSync = true; this.ultimaSync = null; this.horaSyncDia = new Map();
    this.programados = []; this.refSeq = 0; this.refAInc = new Map(); this.verdadRef = new Map();
    this.ultimoNivel = new Map(); this.dronPend = [];
    this._geometria(); this._clima(); this._plantas(); this._ventilacionInicial(); this._drones(); this._focos();
    this.db.corridas.push({corrida_id:this.id, modo:corrida.modo, escenario:corrida.escenario, semilla:corrida.semilla,
      config_json:JSON.stringify(CONFIG), inicio_sim:CONFIG.sim.inicio});
  }
  _geometria(){
    this.camas=[]; this.idxCama=new Map(); this.camaLocal=[];
    for(let b=1;b<=G.bloques;b++) for(let n=1;n<=G.naves_por_bloque;n++) for(let k=1;k<=G.camas_por_nave;k++){
      const num=(n-1)*G.camas_por_nave+k, id=U.camaId(b,n,num);
      const row={cama_id:id,bloque:b,nave:n,cama:num,es_borde:(k===1||k===G.camas_por_nave)?1:0,
        tiene_ventilacion:CONFIG.ventilacion.naves_con_ventilacion.includes(n)?1:0};
      this.idxCama.set(id,this.camas.length); this.camaLocal.push(k-1); this.camas.push(row);
      this.db.idx.lectCama.set(id,[]);
    }
    this.db.camas=this.camas.map(r=>({...r}));
    this.nC=this.camas.length; this.P=G.plantas_por_cama; this.N=this.nC*this.P;
    for(let b=1;b<=G.bloques;b++) this.db.idx.sensor.set(b,[]);
  }
  _clima(){
    const c=CONFIG.clima, r=this.rng, nNav=G.bloques*G.naves_por_bloque;
    this.offT=new Float32Array(nNav); this.offHR=new Float32Array(nNav);
    for(let i=0;i<nNav;i++){this.offT[i]=r.normal(0,c.offset_nave_T);this.offHR[i]=r.normal(0,c.offset_nave_HR);}
    this.eventos=new Map(); const ev=CONFIG.guion_demo.evento;
    for(let b=1;b<=G.bloques;b++){
      const lista=[];
      for(let d=0;d<CONFIG.sim.dias;d++){
        if(r.random()<c.eventos_humedos_por_dia){
          const ini=d*24+r.int(0,23), dur=r.int(c.evento_horas[0],c.evento_horas[1]);
          if(this.c.guion && b===ev.bloque && d<7) continue;
          lista.push({ini,fin:ini+dur,mag:r.uniform(c.evento_mag_hr[0],c.evento_mag_hr[1])});
        }
      }
      if(this.c.guion && b===ev.bloque) lista.push({ini:ev.ini,fin:ev.fin,mag:ev.mag});
      this.eventos.set(b,lista);
    }
    this.wetRing=new Uint8Array(this.nC*24); this.wet24=new Uint8Array(this.nC);
    this.Tv=new Float32Array(this.nC); this.HRv=new Float32Array(this.nC);
  }
  _plantas(){ this.estado=new Uint8Array(this.N); this.tSig=new Float64Array(this.N); this.pv=new Float32Array(this.N); this.pa=new Float32Array(this.nC); }
  _ventilacionInicial(){
    this.vent=new Map();
    for(let b=1;b<=G.bloques;b++) for(const n of CONFIG.ventilacion.naves_con_ventilacion){
      this.vent.set(`${b}-${n}`,{estado:'encendida',token:0});
      this.db.ventilacion.push({corrida_id:this.id,hora:0,bloque:b,nave:n,estado:'encendida',motivo:'Estado inicial',_t:0});
    }
  }
  _drones(){
    this.drones=[];
    for(let b=1;b<=G.bloques;b++){
      const d={dron_id:`B${b}`,bloque:b,pos:1,dir:1,cama_id:U.camaId(b,1,1),estado:'patrulla',bateria:100,cargaHasta:0,
        tarea:null,prioridades:[],ultInspPrio:new Map(),incs:new Map(),revisitas:[]};
      this.drones.push(d);
      this.db.drones.push({corrida_id:this.id,hora:0,dron_id:d.dron_id,cama_id:d.cama_id,estado:'patrulla',bateria:100,_t:0});
    }
  }
  _focos(){
    const r=this.rng, e=CONFIG.enfermedad, gd=CONFIG.guion_demo;
    if(this.c.guion){
      this._programar(gd.hora_foco,h=>{const ci=this.idxCama.get(gd.cama);for(const p of gd.posiciones_foco)this._infectar(ci*this.P+p-1,h);});
    }
    const n=r.int(e.focos_por_temporada[0],e.focos_por_temporada[1]);
    for(let i=0;i<n;i++){
      const b=this.c.guion?r.int(2,G.bloques):r.int(1,G.bloques), nave=r.int(1,G.naves_por_bloque);
      const k=r.random()<0.6?r.choice([1,G.camas_por_nave]):r.int(1,G.camas_por_nave);
      const ci=this.idxCama.get(U.camaId(b,nave,(nave-1)*G.camas_por_nave+k));
      const pos=r.random()<0.5?r.int(1,5):r.int(1,this.P), hora=r.int(0,10*24);
      this._programar(hora,h=>this._infectar(ci*this.P+pos-1,h));
    }
  }
  _programar(hora,fn){this.programados.push({hora,fn});}
  _infectar(i,h){ if(this.estado[i]!==0)return; const e=CONFIG.enfermedad; this.estado[i]=1; this.tSig[i]=h+this.rng.uniform(e.latencia_dias[0],e.latencia_dias[1])*24; }
  _ventOn(b,n){return this.vent.get(`${b}-${n}`)?.estado==='encendida';}
  _eventoHR(b,h){let s=0;for(const e of this.eventos.get(b))if(h>=e.ini&&h<e.fin)s+=e.mag;return s;}
  _esGuion(id){return this.c.guion && id===CONFIG.guion_demo.cama;}

  step(){
    if(this.hora>=CONFIG.sim.dias*24) return false;
    const h=this.hora;
    this._correrProgramados(h);
    this._climaHora(h);
    this._sensores(h);
    this._enfermedad(h);
    this._dronesHora(h);
    if(this.red==='local' && h%24===CONFIG.riesgo.hora_calculo) this.calcularRiesgo(h);
    if(this.red==='sin_red' && this.autoSync && h%24===this._horaSync(Tiempo.dia(h))) this.sincronizar(h);
    this.hora++;
    return true;
  }
  _correrProgramados(h){
    if(!this.programados.length) return;
    const ya=[], resto=[]; for(const p of this.programados)(p.hora<=h?ya:resto).push(p);
    this.programados=resto; ya.sort((a,b)=>a.hora-b.hora).forEach(p=>p.fn(h));
  }
  _horaSync(d){ if(!this.horaSyncDia.has(d)) this.horaSyncDia.set(d,this.rng.int(CONFIG.celular.hora_min,CONFIG.celular.hora_max)); return this.horaSyncDia.get(d); }
  _climaHora(h){
    const c=CONFIG.clima, r=this.rng, s=Math.sin(2*Math.PI*(h-9)/24), slot=h%24;
    for(let i=0;i<this.nC;i++){
      const cam=this.camas[i], kN=(cam.bloque-1)*G.naves_por_bloque+cam.nave-1;
      const T=c.T_media+c.A_T*s+this.offT[kN]+r.normal(0,c.ruido_T);
      let HR=c.HR_media-c.A_HR*s+this.offHR[kN]+c.extra_borde_hr*cam.es_borde+this._eventoHR(cam.bloque,h)
        +(this._ventOn(cam.bloque,cam.nave)?c.delta_ventilacion_hr:0)+r.normal(0,c.ruido_HR);
      HR=clamp(HR,30,100);
      const w=HR>=c.umbral_mojado_hr?1:0;
      this.wet24[i]+=w-this.wetRing[i*24+slot]; this.wetRing[i*24+slot]=w;
      this.Tv[i]=T; this.HRv[i]=HR;
    }
  }
  _sensores(h){
    const sf=CONFIG.sensor_fijo, r=this.rng;
    for(let b=1;b<=G.bloques;b++){
      const id=U.camaId(b,sf.nave,(sf.nave-1)*G.camas_por_nave+sf.cama_en_nave), i=this.idxCama.get(id);
      this._insertLectura({corrida_id:this.id,hora:h,cama_id:id,temp_c:+(this.Tv[i]+r.normal(0,sf.ruido_T)).toFixed(1),
        hr:+clamp(this.HRv[i]+r.normal(0,sf.ruido_HR),30,100).toFixed(1),fuente:'sensor_fijo',_t:h});
    }
  }
  _insertLectura(row){
    this.db.lecturas.push(row);
    if(row.fuente==='sensor_fijo') this.db.idx.sensor.get(U.partes(row.cama_id)[0])[row.hora]=row;
    else this.db.idx.lectCama.get(row.cama_id).push(row);
  }
  _enfermedad(h){
    const e=CONFIG.enfermedad, P=this.P, CN=G.camas_por_nave, est=this.estado, pv=this.pv, pa=this.pa, r=this.rng;
    pv.fill(0); pa.fill(0);
    for(let i=0;i<this.N;i++){
      const st=est[i]; if(st!==1&&st!==2) continue;
      const w=st===1?0.5:1.0, ci=(i/P)|0, p=i%P, k=this.camaLocal[ci];
      for(const d of [-2,-1,1,2]){const q=p+d;if(q>=0&&q<P)pv[ci*P+q]+=w;}
      for(const dk of [-1,1]){const k2=k+dk;if(k2<0||k2>=CN)continue;const cj=ci+dk;for(const d of [-1,0,1]){const q=p+d;if(q>=0&&q<P)pv[cj*P+q]+=0.4*w;}}
      const cam=this.camas[ci];
      if(this._ventOn(cam.bloque,cam.nave)) for(let k2=k+1;k2<CN;k2++) pa[ci+(k2-k)]+=w*Math.exp(-(k2-k)/e.L_aire_camas);
    }
    for(let ci=0;ci<this.nC;ci++){
      const fT=Math.exp(-(((this.Tv[ci]-e.T_opt)/e.T_ancho)**2)), fM=Math.min(1,this.wet24[ci]/e.horas_mojado_full);
      for(let p=0;p<P;p++){
        const i=ci*P+p, st=est[i];
        if(st===0){ if(fM===0)continue; const rate=(e.beta_vec*pv[i]+e.beta_aire*pa[ci]+e.beta_0)*fT*fM; if(r.random()<1-Math.exp(-rate)) this._infectar(i,h); }
        else if(st===1&&h>=this.tSig[i]){est[i]=2;this.tSig[i]=h+r.uniform(e.sintomas_a_perdida_dias[0],e.sintomas_a_perdida_dias[1])*24;}
        else if(st===2&&h>=this.tSig[i]){est[i]=4;}
        else if(st===3&&h>=this.tSig[i]){est[i]=0;}
      }
    }
  }
  _contar(id,sL,sS){
    const ci=this.idxCama.get(id), P=this.P; let real=0,det=0,pos=null;
    for(let p=0;p<P;p++){const st=this.estado[ci*P+p];
      if(st===1){real++;if(pos==null)pos=p+1;if(this.rng.random()<sL)det++;}
      else if(st===2){real++;if(pos==null)pos=p+1;if(this.rng.random()<sS)det++;}}
    return {real,det,pos};
  }
  _tratarPlantas(id,h){
    const e=CONFIG.enfermedad, ci=this.idxCama.get(id), P=this.P;
    for(let p=0;p<P;p++){const i=ci*P+p;if((this.estado[i]===1||this.estado[i]===2)&&this.rng.random()<e.eficacia_tratamiento){this.estado[i]=3;this.tSig[i]=h+e.dias_proteccion*24;}}
  }
  _dronesHora(h){ const tph=60/CONFIG.drones.min_por_cama; for(let k=0;k<tph;k++){const t=h+k/tph;for(const d of this.drones)this._tick(d,t,tph);} }
  _tick(d,t,tph){
    const D=CONFIG.drones;
    if(d.estado==='carga'){ if(t>=d.cargaHasta-1e-9){d.bateria=100;this._mover(d,d.cama_id,'patrulla',t);} return; }
    if(d.bateria<=D.bateria_min){ d.cargaHasta=t+D.horas_carga; this._mover(d,d.cama_id,'carga',t); return; }
    d.bateria=Math.max(0,d.bateria-100/(D.bateria_horas*tph));
    if(!d.tarea){
      const iR=d.revisitas.findIndex(x=>x.hora<=t);
      if(iR>=0){const x=d.revisitas.splice(iR,1)[0];d.tarea={tipo:'revisita',cama_id:x.cama_id,ref:x.ref,fase:'ir'};}
      else while(d.prioridades.length){
        const c=d.prioridades.shift(), u=d.ultInspPrio.get(c);
        if(u!=null&&t-u<D.horas_sin_prioridad) continue;
        if(d.incs.get(c)?.abierta) continue;
        d.tarea={tipo:'prioridad',cama_id:c,fase:'ir'}; break;
      }
    }
    if(d.tarea){
      const ta=d.tarea;
      if(ta.fase==='ir'){ this._mover(d,ta.cama_id,'prioridad',t); this._lecturaDron(d,ta.cama_id,t); ta.fase='insp'; ta.fin=t+D.horas_inspeccion; return; }
      this._mover(d,ta.cama_id,'inspeccionando',t);
      if(t+1e-9>=ta.fin){ this._ejecutarTarea(d,ta,t); d.tarea=null; }
      return;
    }
    let next=d.pos+d.dir; if(next>CAMAS_BLOQUE||next<1){d.dir*=-1;next=d.pos+d.dir;}
    d.pos=next; const id=U.camaId(d.bloque,U.naveDeCama(next),next);
    this._mover(d,id,'patrulla',t); this._lecturaDron(d,id,t); this._inspeccionLigera(d,id,t);
  }
  _mover(d,cama_id,estado,t){
    if(d.cama_id===cama_id&&d.estado===estado) return;
    d.cama_id=cama_id; d.estado=estado;
    const row={corrida_id:this.id,hora:+t.toFixed(2),dron_id:d.dron_id,cama_id,estado,bateria:Math.round(d.bateria),_t:this.red==='local'?t:Infinity};
    this.db.drones.push(row); if(this.red!=='local') this.dronPend.push(row);
  }
  _lecturaDron(d,id,t){
    const i=this.idxCama.get(id), D=CONFIG.drones;
    this._emitir(d,'lectura',{hora:Math.floor(t),cama_id:id,temp_c:+(this.Tv[i]+this.rng.normal(0,D.ruido_lectura_T)).toFixed(1),
      hr:+clamp(this.HRv[i]+this.rng.normal(0,D.ruido_lectura_HR),30,100).toFixed(1),fuente:`dron:${d.dron_id}`},t);
  }
  _inspeccionLigera(d,id,t){
    const D=CONFIG.drones;
    if(d.incs.get(id)?.abierta) return;
    if(this._esGuion(id)) return;
    const {det,pos}=this._contar(id,D.sens_latente,D.sens_sintomas);
    const fp=this.rng.random()<(1-D.especificidad)*D.factor_fp_patrulla;
    if(det>0||fp){
      const ref=++this.refSeq, posicion=pos??this.rng.int(1,this.P);
      this._emitir(d,'sospecha',{ref,cama_id:id,posicion,origen:'patrulla',hora:t,dron_id:d.dron_id},t);
      d.tarea={tipo:'confirmar',cama_id:id,ref,origen:'patrulla',det,posicion,fase:'insp',fin:t+D.horas_inspeccion};
      this._mover(d,id,'inspeccionando',t);
    }
  }
  _ejecutarTarea(d,ta,t){
    const D=CONFIG.drones, gd=CONFIG.guion_demo;
    if(ta.tipo==='confirmar') return this._resolver(d,ta.cama_id,t,ta.ref,ta.det,ta.posicion,null);
    if(ta.tipo==='prioridad'){
      d.ultInspPrio.set(ta.cama_id,t);
      const f=D.factor_inspeccion_prioridad;
      const {det,pos}=this._contar(ta.cama_id,Math.min(1,D.sens_latente*f),D.sens_sintomas);
      const forzar=this._esGuion(ta.cama_id)?{posicion:gd.posicion,plantas:gd.plantas,confianza:gd.confianza}:null;
      if(det>0||forzar){
        const ref=++this.refSeq, posicion=forzar?forzar.posicion:(pos??this.rng.int(1,this.P));
        this._emitir(d,'sospecha',{ref,cama_id:ta.cama_id,posicion,origen:'prediccion',hora:t-D.horas_inspeccion,dron_id:d.dron_id},t);
        this._resolver(d,ta.cama_id,t,ref,det,posicion,forzar);
      }
      return;
    }
    if(ta.tipo==='revisita'){
      const inc=d.incs.get(ta.cama_id); if(!inc) return;
      const {real}=this._contar(ta.cama_id,1,1);
      let res, n=real;
      if(n===0) res='limpia'; else if(n>inc.prev) res='empeora'; else if(n===inc.prev) res='igual'; else res='mejora';
      if(this._esGuion(ta.cama_id)&&inc.n<gd.seguimientos.length){[res,n]=gd.seguimientos[inc.n];}
      inc.n++;
      this._emitir(d,'seguimiento',{ref:inc.ref,hora:t,dron_id:d.dron_id,resultado:res,plantas_afectadas:n,prev:inc.prev,nota:`Revisita automática n.º ${inc.n}`},t);
      inc.prev=n; inc.limpias=res==='limpia'?inc.limpias+1:0;
      if(inc.limpias>=2) inc.abierta=false;
      else d.revisitas.push({cama_id:ta.cama_id,ref:inc.ref,hora:t+D.dias_revisita*24});
    }
  }
  _resolver(d,id,t,ref,det,posicion,forzar){
    const D=CONFIG.drones, {real}=this._contar(id,0,0);
    const confirma=forzar?true:(real>0&&this.rng.random()<D.prob_confirmar);
    const plantas=forzar?forzar.plantas:Math.max(det,1);
    const confianza=forzar?forzar.confianza:+(confirma?this.rng.uniform(...D.confianza_confirmada):this.rng.uniform(...D.confianza_descartada)).toFixed(2);
    this.verdadRef.set(ref,real>0?1:0);
    this._emitir(d,'inspeccion',{ref,hora:t,resultado:confirma?'confirmada':'descartada',confianza,plantas_afectadas:confirma?plantas:0},t);
    if(confirma){ d.incs.set(id,{ref,abierta:true,limpias:0,prev:plantas,n:0}); d.revisitas.push({cama_id:id,ref,hora:t+D.dias_revisita*24}); }
  }
  _emitir(d,tipo,payload,t){
    if(this.red==='local') this._aplicar(tipo,payload,Math.floor(t));
    else this.db.cola_sync.push({id:++this.db.seq.cola,corrida_id:this.id,origen:`dron:${d.dron_id}`,hora_generada:Math.floor(t),hora_recibida:null,tipo,payload:JSON.stringify(payload)});
  }
  _aplicar(tipo,p,ahora){
    const db=this.db;
    if(tipo==='lectura'){ this._insertLectura({corrida_id:this.id,...p,_t:ahora}); return; }
    if(tipo==='sospecha'){
      const row={incidencia_id:++db.seq.incidencia,corrida_id:this.id,cama_id:p.cama_id,posicion:p.posicion,origen:p.origen,estado:'sospecha',
        hora_creada:Math.floor(p.hora),hora_confirmada:null,hora_cerrada:null,confianza:null,plantas_afectadas:null,verdad_infectada:null,_t:ahora};
      db.incidencias.push(row); this.refAInc.set(p.ref,row); return;
    }
    if(tipo==='inspeccion'){
      const inc=this.refAInc.get(p.ref); if(!inc) return;
      const corto=U.corto(inc.cama_id);
      inc.estado=p.resultado; inc.confianza=p.confianza; inc.verdad_infectada=this.verdadRef.get(p.ref)??0;
      if(p.resultado==='confirmada'){
        inc.hora_confirmada=Math.floor(p.hora); inc.plantas_afectadas=p.plantas_afectadas;
        this._alerta({hora:ahora,cama_id:inc.cama_id,incidencia_id:inc.incidencia_id,severidad:'critica',tipo:'confirmacion',
          titulo:`Botrytis confirmada · ${corto}`,
          mensaje:`Botrytis confirmada · ${corto} · posición ${inc.posicion}. ${plural(p.plantas_afectadas,'planta afectada','plantas afectadas')} (confianza ${f2(p.confianza)}).`});
        this._ventilacionAuto(inc,ahora);
        this._programar(ahora+CONFIG.drones.horas_hasta_tratamiento,h=>this._tratar(inc,h));
      } else {
        inc.hora_cerrada=Math.floor(p.hora); inc.plantas_afectadas=0;
        this._alerta({hora:ahora,cama_id:inc.cama_id,incidencia_id:inc.incidencia_id,severidad:'info',tipo:'descartada',
          titulo:`Sospecha descartada · ${corto}`,
          mensaje:`Sospecha descartada · ${corto} · posición ${inc.posicion}. La inspección de cerca no confirmó Botrytis (confianza ${f2(p.confianza)}).`});
      }
      return;
    }
    if(tipo==='seguimiento'){
      const inc=this.refAInc.get(p.ref); if(!inc) return;
      const prevSeg=db.seguimientos.filter(s=>s.incidencia_id===inc.incidencia_id).at(-1);
      db.seguimientos.push({seguimiento_id:++db.seq.seguimiento,incidencia_id:inc.incidencia_id,corrida_id:this.id,hora:Math.floor(p.hora),
        dron_id:p.dron_id,resultado:p.resultado,plantas_afectadas:p.plantas_afectadas,nota:p.nota,_t:ahora});
      const corto=U.corto(inc.cama_id); let sev='info', extra='';
      if(p.resultado==='empeora'){ inc.estado='confirmada'; sev='advertencia'; extra=' Se programa un nuevo tratamiento.';
        this._programar(ahora+CONFIG.drones.horas_hasta_tratamiento,h=>this._tratar(inc,h)); }
      else if(p.resultado==='limpia'&&prevSeg?.resultado==='limpia'){ inc.estado='cerrada'; inc.hora_cerrada=Math.floor(p.hora); extra=' Dos revisitas limpias seguidas: incidencia cerrada.'; }
      else inc.estado='en_seguimiento';
      inc.plantas_afectadas=p.plantas_afectadas;
      this._alerta({hora:ahora,cama_id:inc.cama_id,incidencia_id:inc.incidencia_id,severidad:sev,tipo:'seguimiento',
        titulo:`Seguimiento · ${LABEL.res[p.resultado]} · ${corto}`,
        mensaje:`${p.nota} · ${corto}: ${LABEL.res[p.resultado].toLowerCase()} (${plural(p.plantas_afectadas,'planta afectada','plantas afectadas')}; antes ${p.prev}).${extra}`});
    }
  }
  _tratar(inc,h){ if(inc.estado!=='confirmada') return; inc.estado='en_tratamiento'; this._tratarPlantas(inc.cama_id,h); }
  _alerta(a){ this.db.alertas.push({alerta_id:++this.db.seq.alerta,corrida_id:this.id,...a,estado:'nueva',accion:null,_t:a.hora}); }
  _ventilacionAuto(inc,ahora){
    const [b,n,c]=U.partes(inc.cama_id), v=this.vent.get(`${b}-${n}`);
    if(!v||v.estado!=='encendida') return;
    this.cambiarVentilacion(b,n,'apagada',ahora,`Automático · incidencia #${inc.incidencia_id}`);
    const tok=v.token;
    this._alerta({hora:ahora,cama_id:inc.cama_id,incidencia_id:inc.incidencia_id,severidad:'advertencia',tipo:'ventilacion',
      titulo:`Ventilación apagada · B${b} · Nave ${n}`,
      mensaje:`Se apagó la ventilación de B${b} · Nave ${n} por ${CONFIG.ventilacion.horas_apagado} h tras confirmar Botrytis en la Cama ${c} (incidencia #${inc.incidencia_id}), para frenar el transporte de esporas por el aire. Vigile la humedad de la nave.`});
    this._programar(ahora+CONFIG.ventilacion.horas_apagado,h=>{ if(v.token===tok&&v.estado==='apagada') this.cambiarVentilacion(b,n,'encendida',h,`Automático · fin del apagado de ${CONFIG.ventilacion.horas_apagado} h`); });
  }
  cambiarVentilacion(b,n,estado,hora,motivo){
    const v=this.vent.get(`${b}-${n}`); if(!v) return;
    v.estado=estado; v.token++;
    this.db.ventilacion.push({corrida_id:this.id,hora:Math.floor(hora),bloque:b,nave:n,estado,motivo,_t:Math.floor(hora)});
  }
  variables(id,h){
    const cam=this.camas[this.idxCama.get(id)], m=CONFIG.modelo_prueba, c=CONFIG.clima, D=CONFIG.drones;
    const lect=this.db.idx.lectCama.get(id), sensor=this.db.idx.sensor.get(cam.bloque);
    const HR=[], T=[]; let j=-1;
    for(let x=h-m.ventana_h;x<h;x++){
      if(x<0){HR.push(null);T.push(null);continue;}
      while(j+1<lect.length&&lect[j+1].hora<=x) j++;
      const s=sensor[x], l=j>=0&&x-lect[j].hora<=D.horas_validez_lectura?lect[j]:null, s0=l?sensor[l.hora]:null;
      if(l&&s&&s0){HR.push(clamp(l.hr+(s.hr-s0.hr),30,100));T.push(l.temp_c+(s.temp_c-s0.temp_c));}
      else if(l){HR.push(l.hr);T.push(l.temp_c);}
      else{HR.push(s?s.hr:null);T.push(s?s.temp_c:null);}
    }
    const ult=(arr,n)=>arr.slice(-n).filter(v=>v!=null), mean=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null;
    const hr24=ult(HR,24), hrPrev=HR.slice(-48,-24).filter(v=>v!=null);
    const wet72=HR.filter(v=>v!=null&&v>=c.umbral_mojado_hr).length, wet24=hr24.filter(v=>v>=c.umbral_mojado_hr).length;
    const tMean=mean(ult(T,24)), hrMean=mean(hr24), hrMeanPrev=mean(hrPrev);
    let dist=99;
    for(const inc of this.db.incidencias){
      if(inc._t>h||!['confirmada','en_tratamiento','en_seguimiento'].includes(inc.estado)) continue;
      const [b2,n2,c2]=U.partes(inc.cama_id); if(b2===cam.bloque&&n2===cam.nave) dist=Math.min(dist,Math.abs(c2-cam.cama));
    }
    const ultLect=lect.length?lect[lect.length-1]:null;
    return {wet72,wet24,tMean,hrMean,hrMax24:hr24.length?Math.max(...hr24):null,deltaHR:hrMean!=null&&hrMeanPrev!=null?hrMean-hrMeanPrev:0,
      dist,borde:cam.es_borde,edad:ultLect?h-ultLect.hora:null,ultFuente:ultLect?ultLect.fuente:'sensor_fijo'};
  }
  calcularRiesgo(h){
    const dia=Tiempo.dia(h), m=CONFIG.modelo_prueba, e=CONFIG.enfermedad, R=CONFIG.riesgo, gd=CONFIG.guion_demo;
    this.db.riesgo=this.db.riesgo.filter(r=>r.dia!==dia);
    const altos=new Map();
    for(const cam of this.camas){
      const v=this.variables(cam.cama_id,h);
      const fT=v.tMean==null?0:Math.exp(-(((v.tMean-e.T_opt)/e.T_ancho)**2));
      const reglas=clamp(fT*Math.min(1,v.wet72/m.umbral_mojado_reglas_h)*(1+(v.dist<=1?m.bonus_vecina:0)),0,1);
      const cerc=v.dist<99?Math.exp(-v.dist/2):0;
      const z=m.a0+m.a_mojado*v.wet72+m.a_temp*fT+m.a_borde*v.borde+m.a_vecina*cerc+m.a_delta*Math.max(0,v.deltaHR)+this.rng.normal(0,m.ruido);
      let prob=1/(1+Math.exp(-z));
      if(this._esGuion(cam.cama_id)&&dia===gd.dia_alerta) prob=Math.max(prob,gd.prob_min);
      prob=+prob.toFixed(3);
      const nivel=prob>=R.umbral_alto?'alto':prob>=R.umbral_medio?'medio':'bajo';
      this.db.riesgo.push({corrida_id:this.id,dia,cama_id:cam.cama_id,enfermedad:'botrytis',riesgo_reglas:+reglas.toFixed(3),prob_ia_7d:prob,nivel,_t:h});
      if(nivel==='alto'){
        if(this.ultimoNivel.get(cam.cama_id)!=='alto'){
          const corto=U.corto(cam.cama_id);
          this._alerta({hora:h,cama_id:cam.cama_id,incidencia_id:null,severidad:'advertencia',tipo:'riesgo_7d',
            titulo:`Riesgo alto de Botrytis · ${corto}`,
            mensaje:`${corto}: alto riesgo de Botrytis en los próximos 7 días (prob. ${prob.toFixed(2)}). HR > 90 % durante ${v.wet72} h.`});
        }
        if(!altos.has(cam.bloque)) altos.set(cam.bloque,[]);
        altos.get(cam.bloque).push({id:cam.cama_id,prob,g:this._esGuion(cam.cama_id)});
      }
      this.ultimoNivel.set(cam.cama_id,nivel);
    }
    for(const d of this.drones){
      const l=(altos.get(d.bloque)||[]).sort((a,b)=>(b.g-a.g)||(b.prob-a.prob));
      d.prioridades=l.map(x=>x.id);
    }
  }
  sincronizar(h){
    const pend=this.db.cola_sync.filter(r=>r.hora_recibida==null);
    for(const r of pend){ r.hora_recibida=h; this._aplicar(r.tipo,JSON.parse(r.payload),h); }
    for(const row of this.dronPend) row._t=h; this.dronPend=[];
    this.ultimaSync=h;
    this.calcularRiesgo(h);
    return pend.length;
  }
}

/* =====================================================================
   5. HUB  (hub/db.py + hub/alertas.py + hub/ventilacion.py + hub/celular.py)
      La UI solo usa estas funciones. Nunca devuelve `verdad_infectada`.
   ===================================================================== */
const SEV_RANK={critica:0,advertencia:1,info:2};
const ABIERTA=e=>!['cerrada','descartada'].includes(e);
const Hub = {
  src:null,
  ahora(){return this.src.hora;},
  vis(r){return r._t<=this.src.hora;},
  corrida(){return this.src.db.corridas[0];},
  red(){return this.src.red;},
  riesgoUltimo(){
    const hoy=Tiempo.dia(this.ahora()); let dia=null; const m=new Map();
    for(const r of this.src.db.riesgo) if(this.vis(r)&&r.dia<=hoy&&(dia==null||r.dia>dia)) dia=r.dia;
    if(dia!=null) for(const r of this.src.db.riesgo) if(r.dia===dia&&this.vis(r)) m.set(r.cama_id,r);
    return {dia,mapa:m};
  },
  riesgoDia(dia){const m=new Map();for(const r of this.src.db.riesgo)if(r.dia===dia&&this.vis(r))m.set(r.cama_id,r);return m;},
  riesgoCama(id){return this.src.db.riesgo.filter(r=>r.cama_id===id&&this.vis(r)).sort((a,b)=>a.dia-b.dia);},
  serieRiesgo(){
    const m=new Map();
    for(const r of this.src.db.riesgo){ if(!this.vis(r)) continue; if(!m.has(r.dia)) m.set(r.dia,{dia:r.dia,alto:0,medio:0,bajo:0}); m.get(r.dia)[r.nivel]++; }
    return [...m.values()].sort((a,b)=>a.dia-b.dia);
  },
  variablesCama(id){return this.src.variables(id,this.ahora());},
  lecturasCama(id,desde,hasta){
    const [b]=U.partes(id), out=[];
    for(const r of this.src.db.idx.lectCama.get(id)) if(r.hora>=desde&&r.hora<=hasta&&this.vis(r)) out.push(r);
    const s=this.src.db.idx.sensor.get(b), sens=[]; for(let x=Math.max(0,desde);x<=hasta;x++) if(s[x]&&this.vis(s[x])) sens.push(s[x]);
    return {cama:out,sensor:sens};
  },
  climaActual(id){
    const h=this.ahora(), arr=this.src.db.idx.lectCama.get(id);
    for(let i=arr.length-1;i>=0;i--){const r=arr[i]; if(this.vis(r)){ if(h-r.hora<=24) return r; break; }}
    const s=this.src.db.idx.sensor.get(U.partes(id)[0]);
    for(let x=h;x>=Math.max(0,h-6);x--) if(s[x]&&this.vis(s[x])) return s[x];
    return null;
  },
  alertas(f={}){
    let a=this.src.db.alertas.filter(r=>this.vis(r));
    if(f.severidad&&f.severidad!=='todas') a=a.filter(r=>r.severidad===f.severidad);
    if(f.estado&&f.estado!=='todas') a=a.filter(r=>r.estado===f.estado);
    if(f.tipo&&f.tipo!=='todos') a=a.filter(r=>r.tipo===f.tipo);
    if(f.tipos) a=a.filter(r=>f.tipos.includes(r.tipo));
    if(f.bloque&&f.bloque!=='todos') a=a.filter(r=>r.cama_id&&U.partes(r.cama_id)[0]===+f.bloque);
    return f.orden==='recientes'?a.sort((x,y)=>y.hora-x.hora||y.alerta_id-x.alerta_id)
      :a.sort((x,y)=>(SEV_RANK[x.severidad]-SEV_RANK[y.severidad])||(y.hora-x.hora)||(y.alerta_id-x.alerta_id));
  },
  incidencias(f={}){
    const cols=['incidencia_id','corrida_id','cama_id','posicion','origen','estado','hora_creada','hora_confirmada','hora_cerrada','confianza','plantas_afectadas'];
    let a=this.src.db.incidencias.filter(r=>this.vis(r)).map(r=>Object.fromEntries(cols.map(k=>[k,r[k]])));
    if(f.cama_id) a=a.filter(r=>r.cama_id===f.cama_id);
    if(f.bloque) a=a.filter(r=>U.partes(r.cama_id)[0]===f.bloque);
    if(f.grupo==='abiertas') a=a.filter(r=>ABIERTA(r.estado));
    if(f.grupo==='cerradas') a=a.filter(r=>r.estado==='cerrada');
    if(f.grupo==='descartadas') a=a.filter(r=>r.estado==='descartada');
    return a.sort((x,y)=>y.hora_creada-x.hora_creada||y.incidencia_id-x.incidencia_id);
  },
  seguimientos(incId){return this.src.db.seguimientos.filter(s=>(incId==null||s.incidencia_id===incId)&&this.vis(s)).sort((a,b)=>a.hora-b.hora);},
  dronesActual(){
    const out=new Map(), rows=this.src.db.drones;
    for(let i=rows.length-1;i>=0&&out.size<G.bloques;i--){const r=rows[i];if(!out.has(r.dron_id)&&this.vis(r))out.set(r.dron_id,r);}
    return out;
  },
  prioridadesDron(dron_id){return (this.src.drones.find(d=>d.dron_id===dron_id)?.prioridades||[]).slice(0,6);},
  ultimaVisita(id){const rows=this.src.db.drones;for(let i=rows.length-1;i>=0;i--){const r=rows[i];if(r.cama_id===id&&this.vis(r))return r;}return null;},
  ventilacionActual(){const m=new Map();for(const r of this.src.db.ventilacion)if(this.vis(r))m.set(`${r.bloque}-${r.nave}`,r);return m;},
  ventilacionHistorial(n=20){return this.src.db.ventilacion.filter(r=>this.vis(r)&&r.hora>0).slice(-n).reverse();},
  colaPendiente(){return this.src.db.cola_sync.filter(r=>r.hora_recibida==null);},
  ultimaSync(){return this.src.ultimaSync;},
  lecturasRecibidas(horas){const h=this.ahora();let n=0;for(const r of this.src.db.lecturas)if(r.fuente!=='sensor_fijo'&&this.vis(r)&&r.hora>=h-horas)n++;return n;},
  cobertura(horas=24,bloque=null){
    const h=this.ahora(); let tot=0,ok=0;
    for(const c of this.src.db.camas){ if(bloque&&c.bloque!==bloque) continue; tot++;
      const arr=this.src.db.idx.lectCama.get(c.cama_id);
      for(let i=arr.length-1;i>=0;i--){const r=arr[i]; if(this.vis(r)){ if(r.hora>=h-horas) ok++; break; }}
    }
    return tot?ok/tot:0;
  },
  metricas(){
    const inc=this.incidencias(), al=this.alertas(), conf=inc.filter(i=>i.hora_confirmada!=null), desc=inc.filter(i=>i.estado==='descartada');
    const resp=[];
    for(const i of conf){
      const a=al.filter(x=>x.tipo==='riesgo_7d'&&x.cama_id===i.cama_id&&x.hora<=i.hora_confirmada&&i.hora_confirmada-x.hora<=7*24).sort((x,y)=>x.hora-y.hora)[0];
      if(a) resp.push(i.hora_confirmada-a.hora);
    }
    return {
      respuesta:resp.length?resp.reduce((s,v)=>s+v,0)/resp.length:null, nResp:resp.length,
      conf:conf.length, desc:desc.length, tasa:conf.length+desc.length?conf.length/(conf.length+desc.length):null,
      cobertura:this.cobertura(24), revisitas:this.seguimientos().length,
      porOrigen:{prediccion:inc.filter(i=>i.origen==='prediccion').length,patrulla:inc.filter(i=>i.origen==='patrulla').length},
      porTipo:Object.fromEntries(Object.keys(LABEL.tipo).map(t=>[t,al.filter(a=>a.tipo===t).length])),
      plantas:inc.filter(i=>ABIERTA(i.estado)).reduce((s,i)=>s+(i.plantas_afectadas||0),0),
    };
  },
  // ---- escrituras permitidas por el contrato ----
  marcarVista(id){const a=this.src.db.alertas.find(r=>r.alerta_id===id);if(a&&a.estado==='nueva')a.estado='vista';},
  resolver(id,accion){
    const a=this.src.db.alertas.find(r=>r.alerta_id===id);
    if(!a||a.estado==='resuelta') return false;
    if(!(CONFIG.acciones[a.tipo]||[]).includes(accion)) return false;
    a.estado='resuelta'; a.accion=accion;
    if(a.tipo==='ventilacion'&&a.cama_id){const [b,n]=U.partes(a.cama_id);
      if(accion==='mantener_encendida') this.cambiarVentilacion(b,n,'encendida',`Manual · agrónomo (alerta #${id})`);}
    return true;
  },
  cambiarVentilacion(b,n,estado,motivo='Manual · agrónomo'){this.src.cambiarVentilacion(b,n,estado,this.ahora(),motivo);},
};

function sparkline(vals,color){
  if(vals.length<2) return '';
  const W=96,H=30,max=Math.max(1,...vals),X=i=>i/(vals.length-1)*W,Y=v=>H-3-(v/max)*(H-6);
  const d=vals.map((v,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join('');
  return `<svg class="spark" viewBox="0 0 ${W} ${H}"><path d="${d} L${W},${H} L0,${H}Z" fill="${color}" opacity=".12"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}
function renderKpis(){
  const h=Hub.ahora(), al=Hub.alertas(), inc=Hub.incidencias();
  const crit=al.filter(a=>a.severidad==='critica'&&a.estado==='nueva').length, crit24=al.filter(a=>a.severidad==='critica'&&a.hora>h-24).length;
  const abiertas=inc.filter(i=>ABIERTA(i.estado)).length, nuevas24=inc.filter(i=>i.hora_creada>h-24).length;
  const serie=Hub.serieRiesgo(), ult=serie.at(-1), prev=serie.at(-2);

    {i:'wind',c:'var(--info)',v:off,l:'Naves con ventilación apagada',d:`de <b>${v.size}</b> naves controlables`},
  ];
  document.getElementById('kpis').innerHTML=k.map(x=>`<div class="card kpi"><div class="row between">${icoBox(x.i,x.c,true,17)}${x.sp||''}</div><div><div class="v">${x.v}</div><div class="l">${x.l}</div></div><div class="d">${x.d}</div></div>`).join('');

function ladoFinca(mapa){
  const h=Hub.ahora(), dr=Hub.dronesActual().get(`B${UI.bloque}`), sinRed=Hub.red()==='sin_red';
  const altos=[...mapa.values()].filter(r=>r.nivel==='alto'&&U.partes(r.cama_id)[0]===UI.bloque).sort((a,b)=>b.prob_ia_7d-a.prob_ia_7d);
  const medios=[...mapa.values()].filter(r=>r.nivel==='medio'&&U.partes(r.cama_id)[0]===UI.bloque).sort((a,b)=>b.prob_ia_7d-a.prob_ia_7d);
  const rank=[...altos,...medios].slice(0,6);
  return `${tarjetaDron(dr,h,sinRed)}
    <div class="card"><div class="card-hd" style="margin-bottom:8px"><div><h3>Camas a vigilar</h3><div class="sub">${plural(altos.length,'cama','camas')} en riesgo alto en el bloque</div></div></div>
      ${rank.length?`<div class="rank">${rank.map(r=>`<div class="rank-i" data-act="cama" data-v="${r.cama_id}"><span class="small" style="font-weight:600">${esc(U.sinBloque(r.cama_id))}</span><div class="bar" style="--c:${rgb(rampa(RAMPA_RIESGO,r.prob_ia_7d))}"><i style="width:${r.prob_ia_7d*100}%"></i></div><span class="p">${pct(r.prob_ia_7d)}</span></div>`).join('')}</div>`
        :`<div class="small muted" style="padding:8px 0">Sin camas en riesgo medio o alto.</div>`}
    </div>`;
}
function tarjetaDron(dr,h,sinRed){

  return `<div class="card">
    <div class="card-hd">${icoBox('drone',V_DRON[dr.estado],false,20)}<div><h3>Dron ${esc(dr.dron_id)}</h3><div class="sub">${sinRed?'Última posición conocida':'Cámara 360 · sensores de clima'}</div></div><div class="spacer"></div>${chip(LABEL.dron[dr.estado],C_DRON[dr.estado],true,dr.estado==='inspeccionando'?'pulse':'')}</div>
    <div class="dron-pos" data-act="cama" data-v="${dr.cama_id}" style="cursor:pointer"><div class="tiny muted">Ubicación</div><div class="v">${esc(U.sinBloque(dr.cama_id))}</div><div class="tiny faint">${Tiempo.etiqueta(dr.hora)}${sinRed?' · '+Tiempo.hace(dr.hora,h):''}</div></div>
    <div class="stats2">
      <div class="stat"><div class="l">${ic('thermo',13)}Temperatura</div><div class="v">${cl?f1(cl.temp_c)+' °C':'—'}</div></div>
      <div class="stat"><div class="l">${ic('drop',13)}Humedad</div><div class="v">${cl?f1(cl.hr)+' %':'—'}</div></div>
    </div>
    <div class="row between" style="margin:14px 0 6px"><span class="small muted" style="display:flex;gap:6px;align-items:center">${ic('battery',14)}Batería</span><b class="num">${dr.bateria} %</b></div>
    <div class="bar" style="--c:${bc}"><i style="width:${dr.bateria}%"></i></div>
    <div class="sec">Cola de prioridad</div>
    <div class="row" style="gap:6px">${pri.length?pri.map(id=>`<span class="chip c-advertencia" style="cursor:pointer" data-act="cama" data-v="${id}">${esc(U.sinBloque(id))}</span>`).join(''):'<span class="small muted">Patrulla rutinaria por todas las camas del bloque.</span>'}</div>
  </div>`;
}

/* ---------- Mapa 3D (SVG con proyección propia, sin librerías) ---------- */
const Mapa = {
  theta:CONFIG.mapa.vista_inicial.theta, elev:CONFIG.mapa.vista_inicial.elev, zoom:CONFIG.mapa.vista_inicial.zoom,
  capa:'riesgo', drag:null, movido:false, suprimir:false, raf:0, bloquePrevio:null,
  dims(){const M=CONFIG.mapa;return {W:G.camas_por_nave*(M.cama_ancho+M.sep_camas)-M.sep_camas, D:G.naves_por_bloque*(M.cama_largo+M.pasillo)-M.pasillo};},
  mount(host){
    host.innerHTML=`<svg id="m3d" viewBox="-430 -300 860 600" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Mapa 3D del bloque">
      <defs><filter id="fSombra" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".22"/></filter>
        <marker id="mkFlujo" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M1 1 9 5 1 9" fill="none" style="stroke:var(--flow)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
      <g id="mSuelo"></g><g id="mCamas" filter="url(#fSombra)"></g><g id="mMarcas"></g><g id="mEtiq"></g>
      <g id="mDron" class="m-dron">
        <ellipse class="m-sombra" cx="0" cy="0" rx="11" ry="4.5"/>
        <rect class="m-cable" x="-.8" y="0" width="1.6" height="1"/>
        <circle class="halo" r="17"/>
        <g class="cuerpo"><line class="brazo" x1="-8" y1="-8" x2="8" y2="8"/><line class="brazo" x1="8" y1="-8" x2="-8" y2="8"/>
          <circle class="rotor" cx="-8" cy="-8" r="4.6"/><circle class="rotor" cx="8" cy="-8" r="4.6"/><circle class="rotor" cx="-8" cy="8" r="4.6"/><circle class="rotor" cx="8" cy="8" r="4.6"/>
          <circle class="nucleo" r="4.6"/></g>
        <text class="tag" x="16" y="-12"></text>
      </g>
    </svg><div class="mapa-hint">${ic('move',13)}Arrastra para girar · rueda para acercar · clic en una cama para ver el detalle</div>`;
    const svg=host.querySelector('svg');
    svg.addEventListener('pointerdown',e=>{
      if(e.button!==0) return;
      this.drag={x:e.clientX,y:e.clientY,t:this.theta,el:this.elev}; this.movido=false;
      const mv=ev=>{
        const dx=ev.clientX-this.drag.x, dy=ev.clientY-this.drag.y;
        if(!this.movido&&Math.abs(dx)+Math.abs(dy)<5) return;
        if(!this.movido){this.movido=true;svg.classList.add('arrastrando','sin-anim');document.getElementById('tip').style.display='none';}
        this.theta=this.drag.t+dx*0.35; this.elev=clamp(this.drag.el-dy*0.28,16,90); this.pedir();
      };
      const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);
        svg.classList.remove('arrastrando'); setTimeout(()=>svg.classList.remove('sin-anim'),60);
        if(this.movido){this.suprimir=true;setTimeout(()=>this.suprimir=false,0);actualizarHerramientas();}
        this.drag=null;};
      window.addEventListener('pointermove',mv); window.addEventListener('pointerup',up);
    });
    svg.addEventListener('wheel',e=>{e.preventDefault();this.zoom=clamp(this.zoom*(e.deltaY<0?1.08:1/1.08),0.6,2.6);svg.classList.add('sin-anim');this.pedir();clearTimeout(this._wt);this._wt=setTimeout(()=>svg.classList.remove('sin-anim'),120);},{passive:false});
  },
  pedir(){ if(this.raf) return; this.raf=requestAnimationFrame(()=>{this.raf=0;this.render();}); },
  animarA(t,e,z){
    const norm=a=>((a%360)+540)%360-180;
    this.theta=norm(this.theta);
    const t0=this.theta,e0=this.elev,z0=this.zoom,ini=performance.now(), svg=document.getElementById('m3d');
    svg?.classList.add('sin-anim');
    const paso=now=>{const k=Math.min(1,(now-ini)/520),q=1-Math.pow(1-k,3);
      this.theta=t0+(t-t0)*q;this.elev=e0+(e-e0)*q;this.zoom=z0+(z-z0)*q;this.render();
      if(k<1)requestAnimationFrame(paso);else{svg?.classList.remove('sin-anim');actualizarHerramientas();}};
    requestAnimationFrame(paso);
  },
  valor(id,r){
    if(this.capa==='riesgo') return r?{v:r.prob_ia_7d,c:rampa(RAMPA_RIESGO,r.prob_ia_7d)}:null;
    const cl=Hub.climaActual(id); if(!cl) return null;
    const v=clamp((cl.hr-60)/40,0,1); return {v,c:rampa(RAMPA_HR,v)};
  },
  render(){
    const svg=document.getElementById('m3d'); if(!svg) return;
    const M=CONFIG.mapa, {W,D}=this.dims(), th=this.theta*Math.PI/180, el=this.elev*Math.PI/180, s=this.zoom*0.9;
    const sn=Math.sin(th), cs=Math.cos(th), sE=Math.sin(el), cE=Math.cos(el);
    const P=(x,y,z)=>{const cx=x-W/2,cy=y-D/2,xr=cx*cs-cy*sn,yr=cx*sn+cy*cs;return [xr*s,(yr*sE-z*cE)*s,yr];};
    const pts=a=>a.map(p=>{const q=P(p[0],p[1],p[2]);return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
    const b=UI.bloque, {mapa}=Hub.riesgoUltimo(), vent=Hub.ventilacionActual();
    const incPorCama=new Set(Hub.incidencias({grupo:'abiertas',bloque:b}).map(i=>i.cama_id));
    const sindato=hexRgb(getComputedStyle(document.documentElement).getPropertyValue('--sindato')||'#3E4866');
    const CW=M.cama_ancho, CD=M.cama_largo, paso=CW+M.sep_camas, pasoN=CD+M.pasillo, lados=this.elev<88.5;

    let suelo=`<polygon class="m-base" points="${pts([[-52,-34,0],[W+30,-34,0],[W+30,D+30,0],[-52,D+30,0]])}"/>`, etiq='';
    for(let n=1;n<=G.naves_por_bloque;n++){
      const y0=(n-1)*pasoN, v=vent.get(`${b}-${n}`), off=v&&v.estado==='apagada';
      suelo+=`<polygon class="m-nave ${off?'off':''}" points="${pts([[-8,y0-8,0],[W+8,y0-8,0],[W+8,y0+CD+8,0],[-8,y0+CD+8,0]])}"/>`;
      if(v){const yv=y0+CD+18, a=P(6,yv,0), z=P(W-6,yv,0);
        suelo+=`<line class="m-flujo ${off?'off':''}" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${z[0].toFixed(1)}" y2="${z[1].toFixed(1)}" ${off?'':'marker-end="url(#mkFlujo)"'}/>`;}
      const L=P(-30,y0+CD/2,0); etiq+=`<text class="m-lbl" x="${L[0].toFixed(1)}" y="${(L[1]+4).toFixed(1)}" text-anchor="middle">N${n}</text>`;
    }
    const cajas=[];
    for(let n=1;n<=G.naves_por_bloque;n++) for(let k=1;k<=G.camas_por_nave;k++){
      const num=(n-1)*G.camas_por_nave+k, id=U.camaId(b,n,num), x0=(k-1)*paso, y0=(n-1)*pasoN;
      const val=this.valor(id,mapa.get(id)), hgt=val?4+val.v*M.altura_max:2, col=val?val.c:sindato;
      cajas.push({id,num,x0,y0,x1:x0+CW,y1:y0+CD,h:hgt,col,d:P(x0+CW/2,y0+CD/2,0)[2]});
    }
    cajas.sort((a,c)=>a.d-c.d);
    let g='', marcas='';
    const caras=[[0,1,'f'],[0,-1,'b'],[1,0,'r'],[-1,0,'l']];
    const alturaDe=new Map();
    for(const c of cajas){
      alturaDe.set(c.id,c);
      let f='';
      if(lados) for(const [nx,ny,k] of caras){
        const nyr=nx*sn+ny*cs; if(nyr<=0.02) continue;
        let q;
        if(k==='f') q=[[c.x0,c.y1,0],[c.x1,c.y1,0],[c.x1,c.y1,c.h],[c.x0,c.y1,c.h]];
        else if(k==='b') q=[[c.x1,c.y0,0],[c.x0,c.y0,0],[c.x0,c.y0,c.h],[c.x1,c.y0,c.h]];
        else if(k==='r') q=[[c.x1,c.y1,0],[c.x1,c.y0,0],[c.x1,c.y0,c.h],[c.x1,c.y1,c.h]];
        else q=[[c.x0,c.y0,0],[c.x0,c.y1,0],[c.x0,c.y1,c.h],[c.x0,c.y0,c.h]];
        f+=`<polygon points="${pts(q)}" fill="${rgb(c.col,0.5+0.22*nyr+(ny!==0?0.04:0))}"/>`;
      }
      const xc=(c.x0+c.x1)/2, a=P(xc,c.y0+6,c.h), z=P(xc,c.y1-6,c.h);
      f+=`<polygon class="m-top" points="${pts([[c.x0,c.y0,c.h],[c.x1,c.y0,c.h],[c.x1,c.y1,c.h],[c.x0,c.y1,c.h]])}" fill="${rgb(c.col)}"/>`;
      f+=`<line class="m-planta" x1="${a[0].toFixed(1)}" y1="${a[1].toFixed(1)}" x2="${z[0].toFixed(1)}" y2="${z[1].toFixed(1)}"/>`;
      if(this.zoom>=1.45){const t=P(xc,(c.y0+c.y1)/2,c.h);f+=`<text class="m-lbl cama" x="${t[0].toFixed(1)}" y="${(t[1]+3).toFixed(1)}" text-anchor="middle">${c.num}</text>`;}
      g+=`<g class="m-cama ${UI.cama===c.id?'sel':''}" data-act="cama" data-v="${c.id}" data-tip="${c.id}">${f}</g>`;
      if(incPorCama.has(c.id)){const t=P(xc,(c.y0+c.y1)/2,c.h);marcas+=`<g class="m-inc" transform="translate(${t[0].toFixed(1)} ${(t[1]-2).toFixed(1)})"><circle class="r" r="6"/><circle class="c" r="5"/></g>`;}
    }
    document.getElementById('mSuelo').innerHTML=suelo;
    document.getElementById('mCamas').innerHTML=g;
    document.getElementById('mMarcas').innerHTML=marcas;
    document.getElementById('mEtiq').innerHTML=etiq;
    // dron de cable
    const dg=document.getElementById('mDron'), dr=Hub.dronesActual().get(`B${b}`), c=dr&&alturaDe.get(dr.cama_id);
    if(!c){dg.style.display='none';return;}
    dg.style.display='';
    if(this.bloquePrevio!==b){svg.classList.add('sin-anim');requestAnimationFrame(()=>requestAnimationFrame(()=>{if(!this.drag)svg.classList.remove('sin-anim');}));this.bloquePrevio=b;}
    const zD=dr.estado==='inspeccionando'?c.h+14:c.h+M.altura_dron;
    const p=P((c.x0+c.x1)/2,(c.y0+c.y1)/2,zD), L=Math.max(0,(zD-c.h)*cE*s);
    dg.style.setProperty('--dc',V_DRON[dr.estado]);
    dg.style.transform=`translate(${p[0].toFixed(1)}px,${p[1].toFixed(1)}px)`;
    dg.querySelector('.m-cable').style.transform=`scaleY(${L.toFixed(1)})`;
    dg.querySelector('.m-sombra').style.transform=`translate(0px,${L.toFixed(1)}px) scale(${(0.6+0.4*sE).toFixed(2)},${(0.5+0.5*sE).toFixed(2)})`;
    dg.querySelector('.tag').textContent=`Dron ${dr.dron_id}`;
  },
};

function graficaClima(lc,sensor,campo,h,{min,max,umbral,unidad,color}){
  const W=520,H=150,pl=34,pr=10,pt=10,pb=22,x0=h-CONFIG.ui.horas_grafica;
  const X=x=>pl+(x-x0)/(h-x0)*(W-pl-pr), Y=y=>pt+(1-(clamp(y,min,max)-min)/(max-min))*(H-pt-pb);
  let g=`<defs><linearGradient id="g_${campo}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color}" stop-opacity=".28"/><stop offset="1" style="stop-color:${color}" stop-opacity="0"/></linearGradient></defs>`;
  for(let i=0;i<=3;i++){const val=min+(max-min)*i/3,y=Y(val);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--border)"/><text x="${pl-6}" y="${y+4}" style="fill:var(--faint)" font-size="10" text-anchor="end">${Math.round(val)}</text>`;}
  for(let d=Math.ceil(x0/24)*24;d<=h;d+=24){const x=X(d);g+=`<text x="${x}" y="${H-5}" style="fill:var(--faint)" font-size="10" text-anchor="${x>W-40?'end':x<pl+20?'start':'middle'}">${Tiempo.corta(d)}</text>`;}
  if(umbral!=null){const y=Y(umbral);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--alto)" stroke-dasharray="4 4" opacity=".8"/>`;}
  const s=sensor.filter(r=>r.hora>=x0);
  if(s.length>1){
    const line=s.map((r,i)=>`${i?'L':'M'}${X(r.hora).toFixed(1)},${Y(r[campo]).toFixed(1)}`).join('');
    g+=`<path d="${line} L${X(s.at(-1).hora).toFixed(1)},${H-pb} L${X(s[0].hora).toFixed(1)},${H-pb}Z" fill="url(#g_${campo})"/><path d="${line}" fill="none" style="stroke:var(--muted)" stroke-width="1.6" stroke-linejoin="round"/>`;
  }
  g+=lc.map(r=>`<circle cx="${X(r.hora).toFixed(1)}" cy="${Y(r[campo]).toFixed(1)}" r="4" style="fill:var(--accent);stroke:var(--card)" stroke-width="2"><title>${Tiempo.etiqueta(r.hora)} · ${r[campo]} ${unidad}</title></circle>`).join('');
  if(!s.length&&!lc.length) g+=`<text x="${W/2}" y="${H/2}" style="fill:var(--muted)" text-anchor="middle" font-size="12">Sin lecturas todavía</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function graficaRiesgo(serie){
  if(!serie.length) return '<div class="small muted">Aún no hay cálculos de riesgo.</div>';
  const W=520,H=120,pl=34,pt=10,pb=22,n=serie.length,bw=(W-pl-10)/n, Y=v=>pt+(1-v)*(H-pt-pb);
  let g='';
  for(const [v,c] of [[CONFIG.riesgo.umbral_alto,'var(--alto)'],[CONFIG.riesgo.umbral_medio,'var(--medio)']]) g+=`<line x1="${pl}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:${c}" stroke-dasharray="4 4" opacity=".6"/><text x="${pl-6}" y="${Y(v)+4}" style="fill:var(--faint)" font-size="10" text-anchor="end">${Math.round(v*100)}%</text>`;
  serie.forEach((r,i)=>{const w=Math.min(26,bw*0.62),x=pl+i*bw+(bw-w)/2,y=Y(r.prob_ia_7d);
    g+=`<rect x="${x}" y="${y}" width="${w}" height="${Math.max(2,H-pb-y)}" rx="5" fill="${rgb(rampa(RAMPA_RIESGO,r.prob_ia_7d))}"><title>${Tiempo.corta(r.dia*24)} · ${pct(r.prob_ia_7d)} · reglas ${f2(r.riesgo_reglas)}</title></rect>`;
    if(n<=8||i%2===n%2) g+=`<text x="${x+w/2}" y="${H-5}" style="fill:var(--faint)" font-size="10" text-anchor="middle">${Tiempo.corta(r.dia*24)}</text>`;});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function timelineInc(i){

}
