    bloques+=`<div><div class="sec" style="margin-top:4px">Bloque ${b}</div><div class="vgrid">${cards}</div></div>`;
  }
  return `<div class="finca"><div class="card stack" style="gap:14px"><div class="card-hd" style="margin:0"><div><h3>Ventilación por nave</h3><div class="sub">Naves con ventilación controlable: ${CONFIG.ventilacion.naves_con_ventilacion.join(', ')}</div></div></div>${bloques}</div>
    <div class="stack"><div class="card"><div class="card-hd">${icoBox('wind','var(--info)',true,16)}<h3>Cuándo apagarla</h3></div><div class="small" style="display:flex;flex-direction:column;gap:10px">
      <div class="factor" style="align-items:flex-start"><span class="chip c-ok">Encendida</span><span class="muted">Baja la humedad de la nave, pero el aire lleva esporas a las camas siguientes.</span></div>
      <div class="factor" style="align-items:flex-start"><span class="chip c-advertencia">Apagada</span><span class="muted">Frena el transporte de esporas, pero sube la humedad, sobre todo en los bordes.</span></div>
      <div class="muted">Se apaga ${CONFIG.ventilacion.horas_apagado} h de forma automática cuando se confirma Botrytis en la nave. Puedes cambiarla manualmente.</div></div></div>
      <div class="card"><div class="card-hd"><h3>Historial</h3></div>${hist.length?`<div class="tl">${hist.map(r=>`<div class="ev" style="--c:var(--${r.estado==='encendida'?'ok':'adv'})"><div class="h">${Tiempo.etiqueta(r.hora)}</div><div class="t">B${r.bloque} · Nave ${r.nave} · ${r.estado}</div><div class="small muted">${esc(r.motivo)}</div></div>`).join('')}</div>`:'<div class="small muted">Sin cambios todavía.</div>'}</div></div></div>`;
}

/* ---------- Análisis ---------- */
function vistaAnalisis(){
  const m=Hub.metricas(), serie=Hub.serieRiesgo();
  const tiles=[
    ['clock','var(--accent)',m.respuesta==null?'—':`${f1(m.respuesta)} h`,'Respuesta tras la alerta',m.nResp?`Entre la alerta a 7 días y la confirmación (${plural(m.nResp,'caso','casos')})`:'Aún sin casos confirmados tras una alerta'],
    ['check','var(--ok)',pct(m.tasa),'Tasa de confirmación',`${m.conf} confirmadas · ${m.desc} descartadas`],
    ['drone','var(--insp)',pct(m.cobertura),'Cobertura del dron · 24 h','Camas medidas directamente'],
    ['repeat','var(--info)',m.revisitas,'Revisitas automáticas','Registradas por el dron'],
  ];
  const totO=m.porOrigen.prediccion+m.porOrigen.patrulla, maxT=Math.max(1,...Object.values(m.porTipo));
  return `<div class="stack">
    <div class="grid4">${tiles.map(([i,c,v,l,d])=>`<div class="card tile">${icoBox(i,c,true,16)}<div class="v">${v}</div><div class="l">${l}</div><div class="d">${d}</div></div>`).join('')}</div>
    <div class="card"><div class="card-hd"><div><h3>Camas en riesgo por día</h3><div class="sub">Cálculo diario del modelo a 7 días</div></div><div class="spacer"></div><div class="leyenda" style="margin:0"><span><i style="background:var(--alto)"></i>Alto</span><span><i style="background:var(--medio)"></i>Medio</span></div></div>${areaRiesgo(serie)}</div>
    <div class="grid2">
      <div class="card"><div class="card-hd"><div><h3>Origen de las detecciones</h3><div class="sub">Cómo encontró el dron cada caso</div></div></div>
        <div class="row" style="gap:28px">${dona([[m.porOrigen.prediccion,'var(--accent)'],[m.porOrigen.patrulla,'var(--insp)']],totO)}
          <div class="stack" style="gap:12px"><div><div class="row" style="gap:8px"><span class="chip c-primary"><span class="d"></span>Predicción</span><b class="num">${m.porOrigen.prediccion}</b></div><div class="tiny muted" style="margin-top:4px">Visita prioritaria por riesgo alto</div></div>
          <div><div class="row" style="gap:8px"><span class="chip c-insp"><span class="d"></span>Patrulla</span><b class="num">${m.porOrigen.patrulla}</b></div><div class="tiny muted" style="margin-top:4px">Recorrido rutinario de camas</div></div></div></div></div>
      <div class="card"><div class="card-hd"><div><h3>Alertas por tipo</h3><div class="sub">${plural(Object.values(m.porTipo).reduce((s,v)=>s+v,0),'alerta','alertas')} en la temporada</div></div></div>
        ${Object.entries(m.porTipo).map(([t,n])=>`<div class="hbar"><span>${LABEL.tipo[t]}</span><div class="bar" style="--c:var(--accent)"><i style="width:${n/maxT*100}%"></i></div><b class="num" style="text-align:right">${n}</b></div>`).join('')}
        <div class="small muted" style="margin-top:10px">Plantas afectadas en incidencias abiertas: <b style="color:var(--text)">${m.plantas}</b></div></div>
    </div>
  </div>`;
}
function areaRiesgo(serie){
  if(serie.length<2) return `<div class="empty" style="padding:30px">${icoBox('chart','var(--accent)')}<div>Se mostrará cuando haya al menos dos días de cálculo.</div></div>`;
  const W=900,H=240,pl=36,pr=12,pt=12,pb=26,n=serie.length,max=Math.max(4,...serie.map(s=>s.alto+s.medio));
  const X=i=>pl+i/(n-1)*(W-pl-pr), Y=v=>pt+(1-v/max)*(H-pt-pb);
  const linea=f=>serie.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(f(s)).toFixed(1)}`).join('');
  const area=(fTop,fBot)=>`${linea(fTop)} ${serie.map((s,i)=>[i,s]).reverse().map(([i,s])=>`L${X(i).toFixed(1)},${Y(fBot(s)).toFixed(1)}`).join('')}Z`;
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" style="stroke:var(--border)"/><text x="${pl-8}" y="${y+4}" style="fill:var(--faint)" font-size="11" text-anchor="end">${Math.round(v)}</text>`;}
  const cada=Math.max(1,Math.ceil(n/8));
  serie.forEach((s,i)=>{if(i%cada===0||i===n-1)g+=`<text x="${X(i)}" y="${H-6}" style="fill:var(--faint)" font-size="11" text-anchor="${i===0?'start':i===n-1?'end':'middle'}">${Tiempo.corta(s.dia*24)}</text>`;});
  g+=`<path d="${area(s=>s.alto+s.medio,s=>s.alto)}" style="fill:var(--medio)" opacity=".28"/><path d="${area(s=>s.alto,()=>0)}" style="fill:var(--alto)" opacity=".32"/>`;
  g+=`<path d="${linea(s=>s.alto+s.medio)}" fill="none" style="stroke:var(--medio)" stroke-width="2"/><path d="${linea(s=>s.alto)}" fill="none" style="stroke:var(--alto)" stroke-width="2.2"/>`;
  g+=serie.map((s,i)=>`<rect x="${X(i)-6}" y="${pt}" width="12" height="${H-pt-pb}" fill="transparent"><title>${Tiempo.corta(s.dia*24)} · alto ${s.alto} · medio ${s.medio}</title></rect>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${g}</svg>`;
}
function dona(partes,total){
  const r=48; let acc=0, g=`<circle r="${r}" fill="none" style="stroke:var(--card-3)" stroke-width="16"/>`;
  if(total) for(const [v,c] of partes){ if(!v) continue; const frac=v/total*100;
    g+=`<circle r="${r}" fill="none" style="stroke:${c}" stroke-width="16" pathLength="100" stroke-dasharray="${frac} ${100-frac}" stroke-dashoffset="${-acc}" transform="rotate(-90)"/>`; acc+=frac; }
  return `<svg width="130" height="130" viewBox="-65 -65 130 130">${g}<text y="6" text-anchor="middle" font-size="22" font-weight="750" style="fill:var(--text)">${total}</text></svg>`;
}

/* ---------- render principal ---------- */
const VISTAS={finca:vistaFinca,alertas:vistaAlertas,incidencias:vistaIncidencias,ventilacion:vistaVentilacion,analisis:vistaAnalisis};
function render(){
  renderNav(); renderTop();
  if(UI.tab==='finca'&&UI.montada==='finca') actualizarFinca();
  else{
    document.getElementById('vista').innerHTML=VISTAS[UI.tab]();
    UI.montada=UI.tab;
    if(UI.tab==='finca'){ Mapa.bloquePrevio=null; Mapa.mount(document.getElementById('mapaHost')); actualizarFinca(); }
  }
  renderDrawer(); avisosCriticos();
}
function irA(tab){ UI.tab=tab; UI.montada=null; window.scrollTo({top:0}); }
function avisosCriticos(){
  const nuevas=Hub.alertas({severidad:'critica',orden:'recientes'}).filter(a=>!UI.criticasVistas.has(a.alerta_id));
  nuevas.forEach(a=>UI.criticasVistas.add(a.alerta_id));
  if(!UI.primera&&nuevas.length) toast(nuevas[0].titulo,nuevas[0].mensaje+(nuevas.length>1?` (+${nuevas.length-1} más)`:''),'var(--crit)','octagon');
  UI.primera=false;
}
function toast(t,m,c='var(--accent)',i='check'){
  const el=document.createElement('div'); el.className='toast';
  el.innerHTML=`${icoBox(i,c,true,16)}<div><div class="tt">${esc(t)}</div><div class="small muted">${esc(m)}</div></div>`;
  const box=document.getElementById('toasts'); box.appendChild(el); while(box.children.length>3) box.firstChild.remove();
  setTimeout(()=>el.remove(),6500);
}

/* ---------- interacción ---------- */
const ACCIONES={
  tab:d=>{irA(d.v);render();},
  bloque:d=>{UI.bloque=+d.v;render();},
  cama:d=>abrirCama(d.v),
  cerrar:()=>{cerrarDrawer();render();},
  capa:d=>{Mapa.capa=d.v;render();},
  vista:d=>{const v=CONFIG.mapa.vista_inicial; if(d.v==='plano')Mapa.animarA(0,90,Mapa.zoom); else Mapa.animarA(v.theta,v.elev,Mapa.zoom);},
  zoom:d=>{Mapa.animarA(Mapa.theta,Mapa.elev,clamp(Mapa.zoom*(+d.v>0?1.25:0.8),0.6,2.6));},
  resetVista:()=>{const v=CONFIG.mapa.vista_inicial;Mapa.animarA(v.theta,v.elev,v.zoom);},
  tema:()=>{const t=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=t;try{localStorage.setItem('bgi-tema',t);}catch(e){}render();},
  alertaToggle:d=>{const id=+d.v;if(UI.abiertas.has(id))UI.abiertas.delete(id);else{UI.abiertas.add(id);Hub.marcarVista(id);}render();},
  verAlerta:d=>{const a=Hub.alertas().find(x=>x.alerta_id===+d.v);irA(a&&TIPOS_TRAZA.includes(a.tipo)?'incidencias':'alertas');UI.abiertas.add(+d.v);Hub.marcarVista(+d.v);UI.filtros={estado:'todas',bloque:'todos'};UI.trazaTipo='todos';render();},
  trazaTipo:d=>{UI.trazaTipo=d.v;render();},
  resolver:d=>{if(Hub.resolver(+d.v,d.a)){toast('Alerta resuelta',LABEL.accion[d.a],'var(--ok)','check');UI.abiertas.delete(+d.v);}render();},
  verMapa:d=>{irA('finca');abrirCama(d.v);},
  verInc:d=>{irA('incidencias');UI.incFiltro='todas';UI.incSel=+d.v;render();},
  filtro:d=>{UI.filtros[d.k]=d.v;render();},
  incFiltro:d=>{UI.incFiltro=d.v;render();},
  incSel:d=>{UI.incSel=+d.v;render();},
  csv:()=>exportarCSV(),
  vent:d=>{Hub.cambiarVentilacion(+d.b,+d.n,d.e);toast('Ventilación actualizada',`B${d.b} · Nave ${d.n}: ${d.e}`,'var(--info)','wind');render();},
};
document.addEventListener('click',e=>{
  if(Mapa.suprimir&&e.target.closest('#m3d')){Mapa.suprimir=false;return;}
  const el=e.target.closest('[data-act]'); if(!el) return;
  const f=ACCIONES[el.dataset.act]; if(f) f(el.dataset,e);
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='filtroSel'){UI.filtros[el.dataset.k]=el.value;render();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&UI.cama){cerrarDrawer();render();}});

const tip=document.getElementById('tip');
document.addEventListener('mouseover',e=>{
  if(Mapa.drag&&Mapa.movido) return;
  const c=e.target.closest('[data-tip]'); if(!c){tip.style.display='none';return;}
  const id=c.dataset.tip, h=Hub.ahora(), r=Hub.riesgoUltimo().mapa.get(id), v=Hub.variablesCama(id), cl=Hub.climaActual(id);
  tip.innerHTML=`<div class="tiny muted">Bloque ${U.partes(id)[0]}</div><b>${esc(U.sinBloque(id))}</b><div class="kv">
    <span>Riesgo 7 días</span><span style="color:${r?rgb(rampa(RAMPA_RIESGO,r.prob_ia_7d)):'inherit'}">${r?`${pct(r.prob_ia_7d)} · ${LABEL.nivel[r.nivel]}`:'—'}</span>
    <span>Horas de mojado (72 h)</span><span>${v.wet72} h</span>
    <span>Clima</span><span>${cl?`${cl.temp_c} °C · ${cl.hr} %`:'—'}</span>
    <span>Medición</span><span>${cl?(cl.fuente==='sensor_fijo'?'Sensor del bloque':'Dron')+' · '+Tiempo.hace(cl.hora,h):'—'}</span></div>`;
  tip.style.display='block';
});
document.addEventListener('mousemove',e=>{if(tip.style.display==='block'){const x=Math.min(e.clientX+16,innerWidth-250);tip.style.left=x+'px';tip.style.top=Math.min(e.clientY+16,innerHeight-150)+'px';}});

/* ---------- arranque ---------- */
(function(){
  let t=null; try{t=localStorage.getItem('bgi-tema');}catch(e){}
  if(!t) t=window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.dataset.theme=t;
  let corrida=CONFIG.fuente.corrida; try{corrida=new URLSearchParams(location.search).get('corrida')||corrida;}catch(e){}
  iniciar(corrida);
  setInterval(()=>{
    UI.acc+=CONFIG.fuente.horas_por_segundo*CONFIG.ui.tick_ms/1000; let n=0;
    while(UI.acc>=1){UI.acc-=1;if(!src.step())break;n++;}
    if(n) render();
  },CONFIG.ui.tick_ms);
})();
</script>
